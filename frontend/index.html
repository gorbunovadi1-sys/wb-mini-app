<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Техника для жизни</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root {
  --bg: #eef2f2;
  --surface: #ffffff;
  --surface-2: #e4ebea;
  --border: #dbe3e2;
  --text: #142523;
  --text-secondary: #5c6d6a;
  --accent: #0e7d6a;
  --accent-soft: rgba(14,125,106,0.10);
  --positive: #1c8a4e;
  --negative: #c0392f;
  --font: "IBM Plex Sans", -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  padding-bottom: calc(64px + env(safe-area-inset-bottom));
}
header {
  padding: 16px 16px 12px;
  position: sticky; top: 0; z-index: 5;
  background: var(--bg);
}
header .eyebrow { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-secondary); font-weight: 600; margin-bottom: 3px; }
header h1 { font-size: 18px; font-weight: 700; }
header .updated { font-size: 11.5px; color: var(--text-secondary); font-family: var(--font-mono); margin-top: 4px; }

main { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 12px; }

.hero-card {
  background: linear-gradient(135deg, var(--accent), #0a5f51);
  color: #eefaf6;
  border-radius: 16px;
  padding: 18px 18px;
  display: flex; flex-direction: column; gap: 4px;
}
.hero-label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; opacity: .85; font-weight: 600; }
.hero-value { font-family: var(--font-mono); font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; }
.hero-sub { font-size: 12.5px; opacity: .9; }
.hero-row { display: flex; gap: 16px; margin-top: 10px; }
.hero-metric { flex: 1; }
.hero-metric .k { font-size: 10.5px; opacity: .8; text-transform: uppercase; letter-spacing: .05em; }
.hero-metric .v { font-family: var(--font-mono); font-size: 15px; font-weight: 600; margin-top: 2px; }

.kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kpi-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 12px 14px;
}
.kpi-card .k { font-size: 10.5px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
.kpi-card .v { font-family: var(--font-mono); font-size: 17px; font-weight: 600; margin-top: 5px; font-variant-numeric: tabular-nums; }
.kpi-card .v.neg { color: var(--negative); }
.kpi-card .v.pos { color: var(--positive); }

.section-title { font-size: 13px; font-weight: 700; margin-top: 4px; display: flex; justify-content: space-between; align-items: center; }
.section-title .hint { font-size: 11px; color: var(--text-secondary); font-weight: 500; }

.product-list { display: flex; flex-direction: column; gap: 8px; }
.product-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 12px 14px;
}
.product-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.product-name { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.product-margin { font-family: var(--font-mono); font-size: 13px; font-weight: 600; flex: none; }
.product-margin.neg { color: var(--negative); }
.product-margin.pos { color: var(--positive); }
.product-bar-track { height: 5px; background: var(--surface-2); border-radius: 3px; margin: 8px 0 8px; overflow: hidden; }
.product-bar-fill { height: 100%; border-radius: 3px; background: var(--accent); }
.product-bar-fill.neg { background: var(--negative); }
.product-meta { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--text-secondary); font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.no-cost-badge { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); font-family: var(--font); margin-left: 6px; }

.notice {
  background: var(--surface-2); border-radius: 10px; padding: 10px 12px; font-size: 12px; color: var(--text-secondary);
  display: flex; gap: 8px; align-items: flex-start; line-height: 1.4;
}

.state-msg { text-align: center; padding: 40px 20px; color: var(--text-secondary); font-size: 13px; }

nav.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  padding-bottom: env(safe-area-inset-bottom);
  z-index: 10;
}
nav.tabbar button {
  flex: 1; background: none; border: none; padding: 9px 4px 8px;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  color: var(--text-secondary); font-family: var(--font); cursor: pointer;
}
nav.tabbar button .icon { font-size: 18px; line-height: 1; }
nav.tabbar button .label { font-size: 10px; font-weight: 600; }
nav.tabbar button.active { color: var(--accent); }
nav.tabbar button:disabled { opacity: .4; }

.tab-panel { display: none; }
.tab-panel.active { display: flex; flex-direction: column; gap: 12px; }
</style>
</head>
<body>
<header>
  <div class="eyebrow">Техника для жизни · ООО «Сириус»</div>
  <h1 id="tab-title">Прибыль и маржа</h1>
  <div class="updated" id="updated-at">загрузка…</div>
</header>

<main>
  <section id="panel-profit" class="tab-panel active"></section>
  <section id="panel-orders" class="tab-panel">
    <div class="state-msg">Вкладка «Заказы» появится в следующей версии</div>
  </section>
  <section id="panel-buyout" class="tab-panel">
    <div class="state-msg">Вкладка «Выкупы» появится в следующей версии</div>
  </section>
  <section id="panel-ads" class="tab-panel">
    <div class="state-msg">Вкладка «Реклама» появится в следующей версии</div>
  </section>
</main>

<nav class="tabbar">
  <button data-tab="orders" data-title="Заказы"><span class="icon">📦</span><span class="label">Заказы</span></button>
  <button data-tab="buyout" data-title="Выкупы"><span class="icon">↩️</span><span class="label">Выкупы</span></button>
  <button data-tab="profit" data-title="Прибыль и маржа" class="active"><span class="icon">💰</span><span class="label">Прибыль</span></button>
  <button data-tab="ads" data-title="Реклама"><span class="icon">📣</span><span class="label">Реклама</span></button>
</nav>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  const applyTheme = () => {
    const p = tg.themeParams || {};
    const root = document.documentElement.style;
    if (p.bg_color) root.setProperty('--bg', p.bg_color);
    if (p.secondary_bg_color) root.setProperty('--surface-2', p.secondary_bg_color);
    if (p.text_color) root.setProperty('--text', p.text_color);
    if (p.hint_color) root.setProperty('--text-secondary', p.hint_color);
  };
  applyTheme();
  tg.onEvent('themeChanged', applyTheme);
}

function initData() {
  return tg ? tg.initData : '';
}

// Tabs
document.querySelectorAll('nav.tabbar button').forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.disabled) return;
    document.querySelectorAll('nav.tabbar button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    document.getElementById('tab-title').textContent = btn.dataset.title;
  });
});

function fmtMoney(v) {
  const sign = v < 0 ? '−' : '';
  return sign + Math.round(Math.abs(v)).toLocaleString('ru-RU') + ' ₽';
}
function fmtNum(v) { return Math.round(v).toLocaleString('ru-RU'); }

async function loadMargin() {
  const panel = document.getElementById('panel-profit');
  try {
    const res = await fetch('/api/margin', { headers: { 'X-Telegram-Init-Data': initData() } });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    renderMargin(data);
  } catch (e) {
    panel.innerHTML = `<div class="state-msg">Не удалось загрузить данные.<br>${e.message}</div>`;
  }
}

function renderMargin(data) {
  const acc = data.account;
  const genDate = new Date(data.generated_at);
  document.getElementById('updated-at').textContent = 'обновлено ' + genDate.toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });

  const sortedProducts = [...data.products].sort((a, b) => b.profit - a.profit);
  const maxAbsProfit = Math.max(...sortedProducts.map(p => Math.abs(p.profit)), 1);
  const costKnown = acc.cost_prices_known_for;
  const costTotal = acc.cost_prices_total_products;

  const productsHtml = sortedProducts.map(p => {
    const negClass = p.profit < 0 ? 'neg' : 'pos';
    const barWidth = Math.max(4, Math.abs(p.profit) / maxAbsProfit * 100);
    return `
    <div class="product-card">
      <div class="product-top">
        <div class="product-name">${p.title}${!p.has_cost_price ? '<span class="no-cost-badge">без себест.</span>' : ''}</div>
        <div class="product-margin ${negClass}">${fmtMoney(p.profit)}</div>
      </div>
      <div class="product-bar-track"><div class="product-bar-fill ${negClass === 'neg' ? 'neg' : ''}" style="width:${barWidth}%"></div></div>
      <div class="product-meta">
        <span>выручка ${fmtMoney(p.revenue)} · ${p.qty} шт.</span>
        <span>маржа ${p.margin_percent.toFixed(1)}%</span>
      </div>
    </div>`;
  }).join('');

  document.getElementById('panel-profit').innerHTML = `
    <div class="hero-card">
      <div class="hero-label">Прибыль за ${data.period_days} дн. ${costTotal ? '' : ''}</div>
      <div class="hero-value">${fmtMoney(acc.profit)}</div>
      <div class="hero-sub">маржа ${acc.margin_percent.toFixed(1)}% от выручки ${fmtMoney(acc.revenue)}</div>
      <div class="hero-row">
        <div class="hero-metric"><div class="k">Комиссия WB</div><div class="v">${fmtMoney(acc.commission)}</div></div>
        <div class="hero-metric"><div class="k">Логистика</div><div class="v">${fmtMoney(acc.logistics)}</div></div>
        <div class="hero-metric"><div class="k">Хранение</div><div class="v">${fmtMoney(acc.storage)}</div></div>
      </div>
    </div>

    <div class="kpi-grid">
      <div class="kpi-card"><div class="k">Реклама</div><div class="v neg">${fmtMoney(acc.ad_spend)}</div></div>
      <div class="kpi-card"><div class="k">Штрафы/удержания</div><div class="v neg">${fmtMoney(acc.penalty_deduction)}</div></div>
      <div class="kpi-card"><div class="k">К выплате от WB</div><div class="v">${fmtMoney(acc.forpay)}</div></div>
      <div class="kpi-card"><div class="k">Себестоимость</div><div class="v">${costKnown ? fmtMoney(acc.cogs_total) : '—'}</div></div>
    </div>

    ${costKnown < costTotal ? `<div class="notice">⚠️ Себестоимость указана для ${costKnown} из ${costTotal} товаров. Пока прибыль по остальным товарам завышена — не учтена закупочная цена.</div>` : ''}

    <div class="section-title">Товары <span class="hint">по прибыли</span></div>
    <div class="product-list">${productsHtml}</div>
  `;
}

loadMargin();
setInterval(loadMargin, 5 * 60 * 1000);
</script>
</body>
</html>
