<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ИИ Движок</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap">
<script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1" integrity="sha384-jb8JQMbMoBUzgWatfe6COACi2ljcDdZQ2OxczGA3bGNeWe+6DChMTBJemed7ZnvJ" crossorigin="anonymous"></script>
<script>
// Restore the saved theme before first paint, so there's no flash of the
// default theme before JS further down applies the real one.
try {
  const savedTheme = localStorage.getItem('ai-engine-theme');
  if (savedTheme && savedTheme !== 'default') document.documentElement.dataset.theme = savedTheme;
} catch (e) {}
</script>
<style>
:root {
  --bg: #07060f; --surface: #131024; --surface-2: #1b1733; --border: #2b2650;
  --text: #ffffff; --text-secondary: #9691b8;
  --accent: #8b5cf6; --accent-2: #4f7cff; --accent-3: #ec4899;
  --accent-gradient: linear-gradient(90deg, var(--accent-2), var(--accent), var(--accent-3));
  --accent-dim: rgba(139,92,246,0.16); --accent-text-on: #ffffff;
  --positive: #34d399; --negative: #f87171;
  --warn-bg: rgba(236,72,153,0.14); --warn-text: #f472b6;
  --scrim: rgba(3,2,10,0.7);
  --glow: 0 0 20px rgba(139,92,246,0.35);
  --font: "Inter", -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
}
/* Тема «Лайм» — чёрный + неоновый лайм */
:root[data-theme="lime"] {
  --bg: #0a0d07; --surface: #141a0f; --surface-2: #1c2415; --border: #2c3620;
  --text: #ffffff; --text-secondary: #a3ac93;
  --accent: #d4ff3d; --accent-2: #b8e62e; --accent-3: #eaff8f;
  --accent-gradient: linear-gradient(90deg, var(--accent-2), var(--accent), var(--accent-3));
  --accent-dim: rgba(212,255,61,0.16); --accent-text-on: #10160a;
  --positive: #7ee787; --negative: #ff6b6b;
  --warn-bg: rgba(212,255,61,0.14); --warn-text: #d4ff3d;
  --scrim: rgba(4,5,2,0.7);
  --glow: 0 0 20px rgba(212,255,61,0.3);
}
/* Тема «Лес» — тёмно-зелёный, мох */
:root[data-theme="forest"] {
  --bg: #070d09; --surface: #101a12; --surface-2: #16241a; --border: #22392a;
  --text: #eef5ee; --text-secondary: #8fae95;
  --accent: #8fef6a; --accent-2: #5fd98a; --accent-3: #c8ffb0;
  --accent-gradient: linear-gradient(90deg, var(--accent-2), var(--accent), var(--accent-3));
  --accent-dim: rgba(143,239,106,0.16); --accent-text-on: #082a0f;
  --positive: #6fe08a; --negative: #ff7a6b;
  --warn-bg: rgba(143,239,106,0.14); --warn-text: #8fef6a;
  --scrim: rgba(2,6,3,0.7);
  --glow: 0 0 20px rgba(143,239,106,0.3);
}
/* Тема «Огонь» — чёрный + красный */
:root[data-theme="red"] {
  --bg: #0d0605; --surface: #170b0a; --surface-2: #201110; --border: #3a1613;
  --text: #ffffff; --text-secondary: #c9a29d;
  --accent: #ff4d4d; --accent-2: #ff7a5c; --accent-3: #ff2d6b;
  --accent-gradient: linear-gradient(90deg, var(--accent-2), var(--accent), var(--accent-3));
  --accent-dim: rgba(255,77,77,0.16); --accent-text-on: #ffffff;
  --positive: #4fd88f; --negative: #ff5c5c;
  --warn-bg: rgba(255,77,77,0.14); --warn-text: #ff7a7a;
  --scrim: rgba(6,2,1,0.7);
  --glow: 0 0 20px rgba(255,77,77,0.35);
}
/* Тема «Светлая» — белый фон, тот же фиолетовый акцент */
:root[data-theme="light"] {
  --bg: #f7f6fb; --surface: #ffffff; --surface-2: #f0eef7; --border: #e1def0;
  --text: #171426; --text-secondary: #6b6690;
  --accent: #8b5cf6; --accent-2: #4f7cff; --accent-3: #ec4899;
  --accent-gradient: linear-gradient(90deg, var(--accent-2), var(--accent), var(--accent-3));
  --accent-dim: rgba(139,92,246,0.10); --accent-text-on: #ffffff;
  --positive: #16a34a; --negative: #dc2626;
  --warn-bg: rgba(236,72,153,0.10); --warn-text: #db2777;
  --scrim: rgba(23,20,38,0.35);
  --glow: 0 0 20px rgba(139,92,246,0.2);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { font-family: var(--font); background: var(--bg); color: var(--text); font-size: 14px; }

.topbar {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; background: var(--bg); border-bottom: 1px solid var(--border);
}
.icon-btn {
  width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text); display: flex; align-items: center; justify-content: center;
  font-size: 16px; cursor: pointer; flex: none;
}
.topbar .title-block { flex: 1; min-width: 0; }
.topbar h1 { font-size: 16px; font-weight: 700; }
.topbar .sub { font-size: 10.5px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .06em; margin-top: 2px; }

main { padding: 16px; display: flex; flex-direction: column; gap: 14px; max-width: 720px; margin: 0 auto; padding-bottom: 90px; }

.marketplace-toggle { display: flex; gap: 8px; }
.marketplace-toggle button {
  flex: 1; border: 1px solid var(--border); background: var(--surface); color: var(--text-secondary);
  font-family: var(--font); font-size: 13px; font-weight: 700; padding: 11px 0; border-radius: 10px; cursor: pointer;
}
.marketplace-toggle button.active { background: var(--accent-gradient); color: var(--accent-text-on); box-shadow: var(--glow); border-color: transparent; }
.marketplace-toggle button:disabled { opacity: 0.4; cursor: not-allowed; }

.cabinet-select-wrap { position: relative; }
.cabinet-select {
  width: 100%; appearance: none; background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 10px 34px 10px 14px; color: var(--text); font-family: var(--font); font-size: 13px; font-weight: 600; cursor: pointer;
}
.cabinet-select-wrap::after {
  content: '▾'; position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
  color: var(--text-secondary); pointer-events: none; font-size: 12px;
}

/* ---- Drawer nav ---- */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 29; opacity: 0; pointer-events: none; transition: opacity .2s ease; }
.scrim.open { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed; top: 0; left: 0; bottom: 0; width: 230px; z-index: 30;
  background: var(--surface); border-right: 1px solid var(--border);
  transform: translateX(-100%); transition: transform .25s ease;
  display: flex; flex-direction: column; padding: 18px 14px;
}
.drawer.open { transform: translateX(0); }
.drawer .brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 20px; }
.drawer .brand-mark {
  width: 32px; height: 32px; border-radius: 9px; background: var(--accent-gradient); box-shadow: var(--glow);
  display: flex; align-items: center; justify-content: center; font-size: 17px;
}
.drawer .brand-name { font-weight: 700; font-size: 13.5px; }
.drawer nav { display: flex; flex-direction: column; gap: 2px; }
.drawer nav button {
  display: flex; align-items: center; gap: 11px; text-align: left;
  padding: 10px 12px; border-radius: 10px; border: none; background: none;
  color: var(--text-secondary); font-family: var(--font); font-size: 13.5px; font-weight: 500; cursor: pointer;
}
.drawer nav button .ic { font-size: 15px; width: 18px; text-align: center; }
.drawer nav button.active { background: var(--accent-dim); color: var(--accent); font-weight: 600; }

.theme-picker { margin-top: auto; padding: 14px 8px 4px; border-top: 1px solid var(--border); }
.theme-picker-label { font-size: 10.5px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px; }
.theme-swatches { display: flex; gap: 10px; }
.theme-swatch {
  width: 30px; height: 30px; border-radius: 50%; border: 2px solid transparent; cursor: pointer;
  padding: 0; position: relative; flex: none;
}
.theme-swatch.active { border-color: var(--text); }

.period-row { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .04em; }
.kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kpi-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 13px 14px; }
.kpi-card .k { font-size: 10.5px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
.kpi-card .v { font-family: var(--font-mono); font-size: 19px; font-weight: 700; margin-top: 6px; font-variant-numeric: tabular-nums; }
.kpi-card .kpi-sub { font-size: 10px; color: var(--text-secondary); margin-top: 5px; line-height: 1.3; }
.delta { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; margin-top: 6px; font-family: var(--font-mono); }
.delta.up { color: var(--positive); }
.delta.down { color: var(--negative); }
.delta.flat { color: var(--text-secondary); }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
.card h3 { font-size: 12.5px; font-weight: 600; margin-bottom: 12px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .04em; }
.card canvas { max-height: 200px; }

.date-range { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
.date-range .field { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 120px; }
.date-range label { font-size: 10px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .04em; }
.date-range input[type=date] {
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 8px; color: var(--text);
  font-family: var(--font); font-size: 12.5px;
}
.date-range button {
  flex: none; border: none; background: var(--accent-gradient); color: var(--accent-text-on); box-shadow: var(--glow);
  font-family: var(--font); font-size: 12.5px; font-weight: 700; padding: 9px 16px; border-radius: 8px; cursor: pointer;
}
.quick-chips { display: flex; gap: 6px; margin-top: 8px; }
.quick-chips button {
  flex: 1; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-secondary);
  font-family: var(--font); font-size: 11px; font-weight: 600; padding: 5px 0; border-radius: 7px; cursor: pointer;
}
.quick-chips button.active-chip { background: var(--accent-gradient); color: var(--accent-text-on); border-color: transparent; }

.product-list { display: flex; flex-direction: column; gap: 10px; }
.product-card .product-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 6px; min-width: 0; }
.product-name { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.product-profit { font-family: var(--font-mono); font-size: 13px; font-weight: 700; flex: none; }
.product-profit.neg { color: var(--negative); }
.product-bar-track { height: 5px; background: var(--surface-2); border-radius: 3px; margin-bottom: 6px; overflow: hidden; }
.product-bar-fill { height: 100%; border-radius: 3px; background: var(--accent-gradient); }
.product-bar-fill.neg { background: var(--negative); }
.product-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-secondary); font-family: var(--font-mono); }
.copy-chip {
  display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; color: var(--text-secondary);
  font-family: var(--font-mono); margin: 4px 0 6px; cursor: pointer; user-select: none;
}
.copy-chip::after { content: '⧉'; font-size: 10px; opacity: 0.6; }
.copy-chip.copied { color: var(--positive); }
.copy-chip.copied::after { content: '✓'; }

.notice { background: var(--warn-bg); border-radius: 10px; padding: 10px 12px; font-size: 12px; color: var(--warn-text); line-height: 1.4; }

.search-box {
  width: 100%; box-sizing: border-box; background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 10px 12px; font-family: var(--font); font-size: 13px; color: var(--text);
}

.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.toggle-label { font-size: 13px; font-weight: 600; }
.toggle-sub { font-size: 11px; color: var(--text-secondary); margin-top: 3px; }
.switch { position: relative; display: inline-block; width: 42px; height: 24px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch-slider {
  position: absolute; inset: 0; background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 24px; cursor: pointer; transition: .15s;
}
.switch-slider::before {
  content: ''; position: absolute; height: 16px; width: 16px; left: 3px; top: 50%; transform: translateY(-50%);
  background: var(--text-secondary); border-radius: 50%; transition: .15s;
}
.switch input:checked + .switch-slider { background: var(--accent-gradient); border-color: transparent; }
.switch input:checked + .switch-slider::before { transform: translate(18px, -50%); background: white; }

.back-btn {
  border: none; background: none; color: var(--accent); font-family: var(--font); font-size: 13px;
  font-weight: 600; padding: 4px 0; cursor: pointer;
}

.in-action-select-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
.in-action-select-row input { width: 16px; height: 16px; flex: none; }
.in-action-select-row label { font-size: 12px; color: var(--text-secondary); }
.cogs-row { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
.cogs-row label { font-size: 10.5px; color: var(--text-secondary); flex: none; }
.cogs-row input {
  flex: 1; min-width: 0; box-sizing: border-box; background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 7px; padding: 5px 8px; font-family: var(--font-mono); font-size: 12px; color: var(--text);
}
.cogs-row button {
  flex: none; border: none; background: var(--accent-gradient); color: var(--accent-text-on);
  font-family: var(--font); font-size: 11px; font-weight: 600; padding: 6px 10px; border-radius: 7px; cursor: pointer;
}
.cogs-row button:disabled { opacity: 0.5; }
.cogs-row button.saved { background: var(--positive); }
.state-msg { text-align: center; padding: 60px 20px; color: var(--text-secondary); font-size: 13px; line-height: 1.6; }
.state-msg b { color: var(--text); }

/* ---- Pricing tab ---- */
.price-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
.price-card.staged { border-color: var(--accent); }
.price-card .p-name { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
.price-card .p-offer { font-size: 10.5px; color: var(--text-secondary); font-family: var(--font-mono); margin-bottom: 10px; }
.price-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.price-field label { font-size: 10px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .03em; display: block; margin-bottom: 4px; }
.price-field input {
  width: 100%; box-sizing: border-box; background: var(--surface-2); border: 1px solid var(--border); border-radius: 7px;
  padding: 7px 8px; font-family: var(--font-mono); font-size: 13px; color: var(--text);
}
.price-summary { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--text-secondary); font-family: var(--font-mono); margin-bottom: 8px; }
.price-profit-row { display: flex; justify-content: space-between; align-items: baseline; padding-top: 8px; border-top: 1px solid var(--border); }
.price-profit-row .pp-label { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; }
.price-profit-row .pp-value { font-family: var(--font-mono); font-size: 17px; font-weight: 700; }
.price-profit-row .pp-value.neg { color: var(--negative); }
.price-profit-row .pp-value.pos { color: var(--positive); }
.price-suggest { font-size: 10.5px; color: var(--text-secondary); margin-top: 4px; }
.price-suggest b { color: var(--positive); font-family: var(--font-mono); }
.price-save-row { margin-top: 10px; display: flex; justify-content: flex-end; }
.price-save-btn {
  border: none; border-radius: 8px; padding: 7px 14px; font-family: var(--font); font-size: 11.5px; font-weight: 700; cursor: pointer;
}
.price-save-btn.pos { background: var(--accent-gradient); color: var(--accent-text-on); box-shadow: var(--glow); }
.price-save-btn.staged-btn { background: var(--positive); color: #06281c; }
.push-bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 12px 16px;
  background: var(--surface); border-top: 1px solid var(--accent); display: none; align-items: center; justify-content: space-between;
}
.push-bar.show { display: flex; }
.push-bar span { font-size: 12.5px; font-weight: 600; }
.push-bar button {
  border: none; background: var(--accent-gradient); color: var(--accent-text-on); font-family: var(--font); font-weight: 700;
  font-size: 12.5px; padding: 9px 16px; border-radius: 8px; cursor: pointer; box-shadow: var(--glow);
}
.push-bar button:disabled { opacity: 0.5; }
</style>
</head>
<body>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer">
  <div class="brand">
    <div class="brand-mark">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M9 4.5C7 4.5 5.5 6 5.5 7.8c0 .5.1 1 .3 1.4C4.7 9.6 4 10.7 4 12c0 1.4.8 2.6 2 3.2-.1.3-.1.7-.1 1 0 2 1.6 3.5 3.5 3.5.6 0 1.1-.1 1.6-.4V6.2C10.3 5.2 9.7 4.5 9 4.5Z" stroke="white" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M15 4.5c2 0 3.5 1.5 3.5 3.3 0 .5-.1 1-.3 1.4 1.1.4 1.8 1.5 1.8 2.8 0 1.4-.8 2.6-2 3.2.1.3.1.7.1 1 0 2-1.6 3.5-3.5 3.5-.6 0-1.1-.1-1.6-.4V6.2c.7-1 1.3-1.7 2-1.7Z" stroke="white" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="7.2" cy="9.5" r="0.9" fill="white"/>
        <circle cx="16.8" cy="9.5" r="0.9" fill="white"/>
        <circle cx="9" cy="14" r="0.9" fill="white"/>
        <circle cx="15" cy="14" r="0.9" fill="white"/>
        <path d="M7.2 9.5 9 14M16.8 9.5 15 14" stroke="white" stroke-width="0.9" stroke-linecap="round" opacity="0.7"/>
      </svg>
    </div>
    <div class="brand-name">ИИ Движок</div>
  </div>
  <nav id="viewNav">
    <button data-view="dashboard" class="active">Дашборд</button>
    <button data-view="analytics">Аналитика</button>
    <button data-view="detail">Детализация</button>
    <button data-view="pricing">Цены</button>
    <button data-view="stock">Остатки</button>
    <button data-view="actions">Акции</button>
    <button data-view="ads">Реклама</button>
    <button data-view="settings">Настройки</button>
  </nav>
  <div class="theme-picker">
    <div class="theme-picker-label">Тема</div>
    <div class="theme-swatches" id="themeSwatches"></div>
  </div>
</aside>

<header class="topbar">
  <button class="icon-btn" id="menuBtn">☰</button>
  <div class="title-block">
    <h1 id="viewTitle">Дашборд</h1>
    <div class="sub" id="topbarSub">выбери кабинет</div>
  </div>
  <button class="icon-btn" id="fullscreenBtn" hidden title="Развернуть на весь экран">⛶</button>
</header>

<main>
  <div class="marketplace-toggle" id="marketplaceToggle"></div>
  <div class="cabinet-select-wrap">
    <select class="cabinet-select" id="cabinetSelect"></select>
  </div>
  <div id="content"><div class="state-msg">Загрузка…</div></div>
</main>

<div class="push-bar" id="pushBar">
  <span id="pushBarText">Изменено: 0</span>
  <button id="pushBarBtn">Отправить обновления</button>
</div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  // True fullscreen (tg.requestFullscreen — hides Telegram's own header and
  // remaps safe areas) used to be requested automatically on every open.
  // That broke the drawer menu (its trigger/panel landed under the remapped
  // safe area and became unreachable) and stretched the layout oddly on
  // phones. Back to expand() only by default — the normal, well-supported
  // "tall app" mode — with fullscreen available on demand via the topbar
  // button instead (see toggleFullscreen()).
  tg.disableVerticalSwipes && tg.disableVerticalSwipes();
}
function fullscreenSupported() {
  return !!(tg && typeof tg.requestFullscreen === 'function' && (!tg.isVersionAtLeast || tg.isVersionAtLeast('8.0')));
}
function toggleFullscreen() {
  if (!tg) return;
  try {
    if (tg.isFullscreen) { tg.exitFullscreen && tg.exitFullscreen(); }
    else { tg.requestFullscreen && tg.requestFullscreen(); }
  } catch (e) {}
}

function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function cssVarAlpha(name, alpha) {
  const hex = cssVar(name).replace('#', '');
  const r = parseInt(hex.slice(0, 2), 16), g = parseInt(hex.slice(2, 4), 16), b = parseInt(hex.slice(4, 6), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

const THEMES = [
  { id: 'default', name: 'Фиолетовая', swatch: 'linear-gradient(135deg, #4f7cff, #ec4899)' },
  { id: 'lime', name: 'Лайм', swatch: 'linear-gradient(135deg, #0a0d07, #d4ff3d)' },
  { id: 'forest', name: 'Лес', swatch: 'linear-gradient(135deg, #070d09, #8fef6a)' },
  { id: 'red', name: 'Огонь', swatch: 'linear-gradient(135deg, #0d0605, #ff4d4d)' },
  { id: 'light', name: 'Светлая', swatch: 'linear-gradient(135deg, #ffffff, #8b5cf6)' },
];

function applyTheme(id) {
  if (id === 'default') delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = id;
  try { localStorage.setItem('ai-engine-theme', id); } catch (e) {}
  renderThemeSwatches();
  // Charts bake colors into the canvas at creation time — cheapest way to
  // pick up the new palette is to just re-render whatever's on screen.
  // loadView() itself is cheap here: every loader below skips re-fetching
  // when it already has cached data and just re-renders from it.
  if (typeof loadView === 'function') loadView();
}

function renderThemeSwatches() {
  const el = document.getElementById('themeSwatches');
  if (!el) return;
  const current = document.documentElement.dataset.theme || 'default';
  el.innerHTML = THEMES.map(t => `<button class="theme-swatch ${t.id === current ? 'active' : ''}" data-theme-id="${t.id}" style="background:${t.swatch}" title="${t.name}"></button>`).join('');
  el.querySelectorAll('.theme-swatch').forEach(btn => btn.addEventListener('click', () => applyTheme(btn.dataset.themeId)));
}
function initData() { return tg ? tg.initData : ''; }

function devTelegramId() {
  return new URLSearchParams(location.search).get('telegram_id');
}
function withAuthQS(path) {
  const id = devTelegramId();
  if (!id) return path;
  return path + (path.includes('?') ? '&' : '?') + `telegram_id=${id}`;
}
async function apiFetch(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign({ 'X-Telegram-Init-Data': initData() }, opts.headers || {});
  const res = await fetch(withAuthQS(path), opts);
  if (!res.ok) {
    let detail = 'HTTP ' + res.status;
    try { detail = (await res.json()).detail || detail; } catch (e) {}
    throw new Error(detail);
  }
  return res.json();
}

function fmtMoney(v) {
  const sign = v < 0 ? '−' : '';
  return sign + Math.round(Math.abs(v)).toLocaleString('ru-RU') + ' ₽';
}
function fmtNum(v) { return Math.round(v).toLocaleString('ru-RU'); }
function rateSourceBadge(source) {
  if (source === 'real') return '<div class="price-suggest" style="opacity:.75">комиссия/логистика — по фактическим продажам</div>';
  if (source === 'estimate') return '<div class="price-suggest" style="opacity:.75">комиссия/логистика — оценка (ещё не продавался), уточнится после первых продаж</div>';
  return '';
}
function isoDate(d) { return d.toISOString().slice(0, 10); }

function deltaHtml(cmp) {
  if (!cmp || cmp.pct === null || cmp.pct === undefined) return '';
  const dir = cmp.pct > 0.05 ? 'up' : cmp.pct < -0.05 ? 'down' : 'flat';
  const arrow = dir === 'up' ? '▲' : dir === 'down' ? '▼' : '·';
  const sign = cmp.pct > 0 ? '+' : '';
  return `<div class="delta ${dir}">${arrow} ${sign}${cmp.pct.toFixed(1)}%</div>`;
}

let activeMarketplace = 'wb';
let activeView = 'dashboard';
let periodFrom = isoDate(new Date(Date.now() - 29 * 86400000));
let periodTo = isoDate(new Date());
let lastMarginData = null;

async function loadDashboard(fromDate, toDate) {
  if (fromDate) periodFrom = fromDate;
  if (toDate) periodTo = toDate;
  const el = document.getElementById('content');
  const reqView = activeView, reqCabinet = activeCabinetId;
  el.innerHTML = '<div class="state-msg">Загрузка данных… (может занять до минуты)</div>';
  try {
    const data = await apiFetch(`/api/cabinets/${activeCabinetId}/margin?date_from=${periodFrom}&date_to=${periodTo}`);
    if (activeView !== reqView || activeCabinetId !== reqCabinet) return; // user navigated away while this was loading
    lastMarginData = data;
    renderDashboard(data, activeCabinet());
  } catch (e) {
    if (activeView !== reqView || activeCabinetId !== reqCabinet) return;
    el.innerHTML = `<div class="state-msg">Не удалось загрузить данные кабинета.<br>${e.message}</div>`;
  }
}

function renderDashboard(data, cabinet) {
  const el = document.getElementById('content');
  const acc = data.account;
  const cmp = data.compare || {};
  const genDate = new Date(data.generated_at);
  const updatedStr = genDate.toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  const isOzon = cabinet && cabinet.marketplace === 'ozon';

  const hasOrdersData = acc.orders_qty !== undefined;
  // For Ozon, orders/buyouts move into the main kpis sequence below (with
  // everything else) so the whole flow — от заказа до чистой прибыли —
  // reads top to bottom in one place. WB keeps the separate summary block.
  const ordersBlock = (hasOrdersData && !isOzon) ? `
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="k">Заказы</div>
        <div class="v">${fmtMoney(acc.orders_revenue)}</div>
        <div class="kpi-sub">${fmtNum(acc.orders_qty)} шт.</div>
      </div>
      <div class="kpi-card">
        <div class="k">Выкуплено</div>
        <div class="v">${fmtMoney(acc.buyouts_revenue)}</div>
        <div class="kpi-sub">${fmtNum(acc.buyouts_qty)} шт.${acc.buyout_rate !== null ? ` · ${acc.buyout_rate}% выкупа` : ''}</div>
      </div>
    </div>
  ` : '';

  // Порядок специально повторяет путь денег: от заказа — к тому, что реально
  // осталось у тебя. Верхний блок (Заказы → Выкуплено) — что произошло с
  // товаром. Средний (Налог → Прочие расходы) — что вычиталось по пути.
  // «К перечислению» — граница между деньгами Ozon и твоими собственными
  // расходами (себестоимость, налог) ниже неё.
  const kpis = isOzon ? [
    { label: 'Заказы', value: fmtMoney(acc.orders_revenue || 0), sub: `${fmtNum(acc.orders_qty || 0)} шт. · все заказы за период, кроме отменённых, по цене продажи — от неё считается комиссия Ozon` },
    { label: 'Отменённые заказы', value: fmtMoney(acc.cancelled_revenue || 0), sub: `${fmtNum(acc.cancelled_qty || 0)} шт. · заказы, которые не стали продажей — в прибыль не входят` },
    { label: 'Выкуплено', value: fmtMoney(acc.buyouts_revenue || 0), cmp: cmp.revenue, sub: `${fmtNum(acc.buyouts_qty || 0)} шт.${acc.buyout_rate !== null ? ` · ${acc.buyout_rate}% выкупа` : ''} · реально купленные товары — от них считается всё ниже` },
    { label: 'Налог', value: fmtMoney(acc.tax || 0), sub: acc.tax_pct ? `${acc.tax_pct}% от цены выкупленных товаров — твой личный налог, не Ozon` : 'не указан % в Настройках — налог не учитывается' },
    { label: 'Себестоимость', value: fmtMoney(acc.cogs_total || 0), sub: 'закупочная цена выкупленных товаров' },
    { label: 'Логистика', value: fmtMoney(acc.delivery || 0), sub: 'доставка выкупленных товаров — по факту начислений Ozon, не оценка' },
    { label: 'Комиссия', value: fmtMoney(acc.commission || 0), sub: 'комиссия Ozon с выкупленных товаров, по факту начислений — реальная ставка, без вычета бонуса' },
    { label: 'Бонус/компенсация Ozon', value: fmtMoney(acc.bonus || 0), sub: 'баллы за скидки — Ozon возвращает эту сумму отдельно от комиссии (учтено в прибыли, не входит в «Комиссию» выше)' },
    { label: 'Сборы по товарам', value: fmtMoney(acc.item_fees || 0), sub: 'мелкие пооперационные сборы Ozon за штуку' },
    { label: 'Прочие расходы площадки', value: fmtMoney(acc.other_fees || 0), sub: 'эквайринг, упаковка, хранение — не привязаны к одному товару' },
    { label: 'Маржа', value: acc.margin_percent.toFixed(1) + '%', cmp: cmp.margin_percent, sub: 'чистая прибыль ÷ выкуплено' },
    { label: 'К перечислению от Ozon', value: fmtMoney(acc.payout_real || 0), sub: 'выкуплено плюс бонус минус комиссия, логистика и сборы Ozon — сколько денег реально придёт от площадки' },
    { label: 'Чистая прибыль', value: fmtMoney(acc.profit), cmp: cmp.profit, sub: 'к перечислению минус твоя себестоимость и налог — то, что остаётся тебе' },
  ] : [
    { label: 'Выручка', value: fmtMoney(acc.revenue), cmp: cmp.revenue },
    { label: 'Прибыль', value: fmtMoney(acc.profit), cmp: cmp.profit },
    { label: 'Реклама', value: fmtMoney(acc.ad_spend || 0) },
    { label: 'Маржа', value: acc.margin_percent.toFixed(1) + '%', cmp: cmp.margin_percent },
  ];

  const daily = data.daily || [];
  const sortedProducts = [...(data.products || [])].sort((a, b) => b.profit - a.profit).slice(0, 8);
  const maxAbsProfit = Math.max(...sortedProducts.map(p => Math.abs(p.profit)), 1);
  const productsHtml = sortedProducts.map(p => productCardHtml(p, maxAbsProfit)).join('')
    || '<div class="state-msg">Нет данных за период</div>';

  const costKnown = acc.cost_prices_known_for || 0, costTotal = acc.cost_prices_total_products || 0;

  el.innerHTML = `
    <div class="card">
      <h3>Период</h3>
      <div class="date-range">
        <div class="field"><label>С</label><input type="date" id="dateFrom" value="${periodFrom}"></div>
        <div class="field"><label>По</label><input type="date" id="dateTo" value="${periodTo}"></div>
        <button id="applyPeriod">Показать</button>
      </div>
      <div class="quick-chips">
        <button data-days="7">7 дн.</button>
        <button data-days="14">14 дн.</button>
        <button data-days="30">30 дн.</button>
        <button data-days="90">90 дн.</button>
      </div>
    </div>

    ${ordersBlock}
    <div class="notice" style="margin-bottom:2px">За период ${data.period_from} — ${data.period_to} (${data.period_days} дн.) · обновлено ${updatedStr}${costTotal ? ` · себестоимость указана для ${costKnown}/${costTotal} товаров` : ''}</div>

    <div class="kpi-grid">
      ${kpis.map(k => `
        <div class="kpi-card">
          <div class="k">${k.label}</div>
          <div class="v">${k.value}</div>
          ${deltaHtml(k.cmp)}
          ${k.sub ? `<div class="kpi-sub">${k.sub}</div>` : ''}
        </div>`).join('')}
    </div>

    <div class="card">
      <h3>Заказы по дням</h3>
      ${daily.length ? `<canvas id="revenueChart"></canvas>` : '<div class="state-msg">Нет данных за период</div>'}
    </div>

    <div class="card">
      <h3>Топ товаров по прибыли</h3>
      <div class="product-list">${productsHtml}</div>
    </div>
  `;

  document.getElementById('applyPeriod').addEventListener('click', () => {
    const f = document.getElementById('dateFrom').value;
    const t = document.getElementById('dateTo').value;
    if (!f || !t) { alert('Укажи обе даты'); return; }
    if (f > t) { alert('Дата "с" не может быть позже даты "по"'); return; }
    loadDashboard(f, t);
  });
  document.querySelectorAll('.quick-chips button').forEach(btn => {
    btn.addEventListener('click', () => {
      const days = parseInt(btn.dataset.days, 10);
      const to = new Date();
      const from = new Date(Date.now() - (days - 1) * 86400000);
      loadDashboard(isoDate(from), isoDate(to));
    });
  });

  bindCogsHandlers(el, () => loadDashboard());

  if (daily.length) {
    const canvas = document.getElementById('revenueChart');
    const ctx = canvas.getContext('2d');
    const lineGradient = ctx.createLinearGradient(0, 0, canvas.clientWidth || 300, 0);
    lineGradient.addColorStop(0, cssVar('--accent-2'));
    lineGradient.addColorStop(0.55, cssVar('--accent'));
    lineGradient.addColorStop(1, cssVar('--accent-3'));
    const fillGradient = ctx.createLinearGradient(0, 0, 0, canvas.clientHeight || 200);
    fillGradient.addColorStop(0, cssVar('--accent-dim'));
    fillGradient.addColorStop(1, 'transparent');

    new Chart(canvas, {
      type: 'line',
      data: {
        labels: daily.map(d => d.date.slice(5)),
        datasets: [{
          data: daily.map(d => d.revenue),
          borderColor: lineGradient, backgroundColor: fillGradient,
          fill: true, tension: 0.35, pointRadius: 0, borderWidth: 2.5,
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => fmtMoney(c.parsed.y) } } },
        scales: {
          x: { grid: { display: false }, ticks: { color: cssVar('--text-secondary'), maxTicksLimit: 6, font: { size: 10 } } },
          y: { grid: { color: cssVar('--border') }, ticks: { color: cssVar('--text-secondary'), font: { size: 10 }, callback: v => (v/1000) + 'k' } }
        }
      }
    });
  }
}

function productCardHtml(p, maxAbsProfit) {
  const neg = p.profit < 0;
  const barWidth = Math.max(4, Math.abs(p.profit) / maxAbsProfit * 100);
  const itemKey = p.offer_id !== undefined && p.offer_id !== null ? p.offer_id : p.nm_id;
  return `<div class="product-card" data-item="${itemKey}">
    <div class="product-top">
      <div class="product-name">${p.title}</div>
      <div class="product-profit ${neg ? 'neg' : ''}">${fmtMoney(p.profit)}</div>
    </div>
    <div class="copy-chip" data-copy="${itemKey}">${itemKey}</div>
    <div class="product-bar-track"><div class="product-bar-fill ${neg ? 'neg' : ''}" style="width:${barWidth}%"></div></div>
    <div class="product-meta"><span>выручка ${fmtMoney(p.revenue)} · ${p.qty} шт.</span><span>маржа ${p.margin_percent.toFixed(1)}%</span></div>
    <div class="cogs-row">
      <label>Закупка/шт.</label>
      <input type="number" class="cogs-input" value="${p.cogs_unit || ''}" placeholder="0">
      <button class="cogs-save">Сохранить</button>
    </div>
  </div>`;
}

function bindCogsHandlers(root, onSaved) {
  root.querySelectorAll('.product-card').forEach(card => {
    const saveBtn = card.querySelector('.cogs-save');
    if (!saveBtn) return; // this card has no cogs-row (e.g. cost price already known)
    saveBtn.addEventListener('click', async () => {
      const btn = card.querySelector('.cogs-save');
      const input = card.querySelector('.cogs-input');
      const itemKey = card.dataset.item;
      const value = parseFloat(input.value);
      if (!value || value < 0) { alert('Укажи закупочную цену за штуку'); return; }
      btn.disabled = true; btn.textContent = 'Сохранение…';
      try {
        await apiFetch(`/api/cabinets/${activeCabinetId}/cost-prices`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prices: { [itemKey]: value } }),
        });
        btn.textContent = 'Сохранено ✓'; btn.classList.add('saved');
        setTimeout(onSaved, 900);
      } catch (e) {
        btn.textContent = 'Ошибка'; btn.disabled = false;
        alert('Не удалось сохранить: ' + e.message);
      }
    });
  });
}

async function loadDetail(fromDate, toDate) {
  const el = document.getElementById('content');
  const reqView = activeView, reqCabinet = activeCabinetId;
  if (fromDate) periodFrom = fromDate;
  if (toDate) periodTo = toDate;
  if (fromDate || toDate) lastMarginData = null; // period changed — cached data no longer matches
  if (!lastMarginData) {
    el.innerHTML = '<div class="state-msg">Загрузка данных… (может занять до минуты)</div>';
    try {
      lastMarginData = await apiFetch(`/api/cabinets/${activeCabinetId}/margin?date_from=${periodFrom}&date_to=${periodTo}`);
    } catch (e) {
      if (activeView !== reqView || activeCabinetId !== reqCabinet) return;
      el.innerHTML = `<div class="state-msg">Не удалось загрузить данные.<br>${e.message}</div>`;
      return;
    }
    if (activeView !== reqView || activeCabinetId !== reqCabinet) return;
  }
  renderDetail(lastMarginData.products || []);
}

    </div>

function computePriceRow(price, cogs, commissionPct, logisticsEstimate, taxPct) {
  const expensePerUnit = price * (commissionPct / 100) + logisticsEstimate;
  const tax = price * ((taxPct || 0) / 100);
  const profit = price - cogs - expensePerUnit - tax;
  return { expensePerUnit, tax, profit };
}

function suggestPrice(cogs, commissionPct, logisticsEstimate, targetMarginPct, taxPct) {
  // price - cogs - price*commissionPct/100 - logistics - price*taxPct/100 = price*targetMarginPct/100
  const denom = 1 - commissionPct / 100 - (taxPct || 0) / 100 - targetMarginPct / 100;
  if (denom <= 0) return null;
  return (cogs + logisticsEstimate) / denom;
}

function bindPriceCard(card) {
  const offerId = card.dataset.offer;
  const commissionPct = parseFloat(card.dataset.commission) || 0;
  const logisticsEstimate = parseFloat(card.dataset.logistics) || 0;
  const taxPct = parseFloat(card.dataset.tax) || 0;
  const oldPriceOriginal = parseFloat(card.dataset.oldPrice) || 0;
  const priceInput = card.querySelector('.price-input');
  const cogsInput = card.querySelector('.cogs-price-input');
  const expenseOut = card.querySelector('.expense-out');
  const profitOut = card.querySelector('.profit-out');
  const suggestOut = card.querySelector('.suggest-out');
  const saveBtn = card.querySelector('.price-save-btn');

  function recalc() {
    const price = parseFloat(priceInput.value) || 0;
    const cogs = parseFloat(cogsInput.value) || 0;
    const { expensePerUnit, tax, profit } = computePriceRow(price, cogs, commissionPct, logisticsEstimate, taxPct);
    expenseOut.textContent = `расход/шт. ${fmtMoney(expensePerUnit)}${tax ? ` + налог ${fmtMoney(tax)}` : ''}`;
    profitOut.textContent = fmtMoney(profit);
    profitOut.classList.toggle('neg', profit < 0);
    profitOut.classList.toggle('pos', profit >= 0);

    if (profit < 0) {
      const suggested = suggestPrice(cogs, commissionPct, logisticsEstimate, 15, taxPct);
      if (suggested && suggested > price) {
        const { profit: newProfit } = computePriceRow(suggested, cogs, commissionPct, logisticsEstimate, taxPct);
        suggestOut.innerHTML = `Чтобы выйти в плюс: цена от <b>${fmtMoney(suggested)}</b> (прибыль ${fmtMoney(newProfit)})`;
      } else {
        suggestOut.textContent = '';
      }
      saveBtn.className = 'price-save-btn';
      saveBtn.style.opacity = '0.4';
      saveBtn.disabled = true;
      saveBtn.textContent = 'Прибыль отрицательная';
    } else {
      suggestOut.textContent = '';
      saveBtn.disabled = false;
      saveBtn.style.opacity = '1';
      const isStaged = pendingPriceChanges[offerId] !== undefined;
      saveBtn.className = 'price-save-btn ' + (isStaged ? 'staged-btn' : 'pos');
      saveBtn.textContent = isStaged ? 'В очереди на отправку ✓' : 'Сохранить';
    }
  }

  priceInput.addEventListener('input', recalc);
  cogsInput.addEventListener('input', recalc);

  saveBtn.addEventListener('click', async () => {
    const price = parseFloat(priceInput.value) || 0;
    const cogs = parseFloat(cogsInput.value) || 0;
    if (price <= 0) { alert('Укажи цену'); return; }
    saveBtn.disabled = true; saveBtn.textContent = 'Сохранение…';
    try {
      if (cogs > 0) {
        await apiFetch(`/api/cabinets/${activeCabinetId}/cost-prices`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prices: { [offerId]: cogs } }),
        });
      }
      // Ozon requires price <= old_price (old_price is the pre-discount
      // reference shown crossed out), AND for many price ranges requires the
      // resulting discount to be > 5% — setting old_price === price passes
      // the first rule but fails the second ("скидка должна быть больше
      // 5%"), so when old_price needs raising, give it 10% headroom instead
      // of matching price exactly.
      const oldPriceToSend = price > oldPriceOriginal ? Math.ceil(price / 0.9) : oldPriceOriginal;
      pendingPriceChanges[offerId] = { price, old_price: oldPriceToSend };
      card.classList.add('staged');
      updatePushBar();
      recalc();
    } catch (e) {
      alert('Не удалось сохранить себестоимость: ' + e.message);
      saveBtn.disabled = false;
    }
  });

  recalc();
}

function updatePushBar() {
  const bar = document.getElementById('pushBar');
  const count = Object.keys(pendingPriceChanges).length;
  document.getElementById('pushBarText').textContent = `Изменено цен: ${count}`;
  bar.classList.toggle('show', count > 0);
}

async function pushPriceUpdates() {
  const btn = document.getElementById('pushBarBtn');
  const updates = Object.entries(pendingPriceChanges).map(([offer_id, v]) => ({ offer_id, price: v.price, old_price: v.old_price }));
  if (!updates.length) return;
  btn.disabled = true; btn.textContent = 'Отправляю…';
  try {
    const resp = await apiFetch(`/api/cabinets/${activeCabinetId}/ozon/prices`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ updates }),
    });
    const results = resp.results || [];
    const failed = results.filter(r => r.updated === false);
    pendingPriceChanges = {};
    pricingItems = null;
    updatePushBar();
    btn.textContent = 'Отправить обновления';
    btn.disabled = false;
    if (failed.length) {
      const lines = failed.map(f => `${f.offer_id}: ${(f.errors || []).map(e => e.message || JSON.stringify(e)).join('; ') || 'отклонено Ozon без причины'}`);
      alert(`Ozon отклонил ${failed.length} из ${results.length} обновлений:\n\n${lines.join('\n')}`);
    } else if (!results.length) {
      alert('Ozon не прислал подтверждение по товарам — проверь цены вручную, возможно обновление не применилось.');
    } else {
      alert(`Ozon подтвердил обновление ${results.length} товар(ов).`);
    }
    loadPricing();
  } catch (e) {
    alert('Не удалось отправить обновления в Ozon: ' + e.message);
    btn.textContent = 'Отправить обновления';
    btn.disabled = false;
  }
}

async function loadStock() {
  const cabinet = activeCabinet();
  if (cabinet && cabinet.marketplace === 'wb') return loadStockWB();
  const el = document.getElementById('content');
  if (!cabinet || cabinet.marketplace !== 'ozon') {
    el.innerHTML = '<div class="state-msg">Кабинет не выбран.</div>';
    return;
  }
  if (stockItems) return renderStock(stockItems);
  const reqView = activeView, reqCabinet = activeCabinetId;
  el.innerHTML = '<div class="state-msg">Загрузка остатков и продаж за 30 дней… (может занять до минуты)</div>';
  try {
    const to = isoDate(new Date());
    const from = isoDate(new Date(Date.now() - 29 * 86400000));
    const [pricingResp, marginResp] = await Promise.all([
      pricingItems ? Promise.resolve({ items: pricingItems }) : apiFetch(`/api/cabinets/${activeCabinetId}/ozon/pricing`),
      apiFetch(`/api/cabinets/${activeCabinetId}/margin?date_from=${from}&date_to=${to}`),
    ]);
    if (activeView !== reqView || activeCabinetId !== reqCabinet) return;
    pricingItems = pricingResp.items;
    const qtyByOffer = {};
    (marginResp.products || []).forEach(p => { qtyByOffer[p.offer_id] = p.qty || 0; });

    stockItems = pricingItems.map(p => {
      const qty30 = qtyByOffer[p.offer_id] || 0;
      const dailyVelocity = qty30 / 30;
      const totalStock = (p.fbo_stock || 0) + (p.fbs_stock || 0);
      const daysLeft = dailyVelocity > 0 ? totalStock / dailyVelocity : null;
      const targetDays = 30;
      const recommendedRestock = dailyVelocity > 0 ? Math.max(0, Math.ceil(targetDays * dailyVelocity - totalStock)) : 0;
      return { ...p, qty30, dailyVelocity, totalStock, daysLeft, recommendedRestock };
    });
    renderStock(stockItems);
  } catch (e) {
    if (activeView !== reqView || activeCabinetId !== reqCabinet) return;
    el.innerHTML = `<div class="state-msg">Не удалось загрузить остатки.<br>${e.message}</div>`;
  }
}

function renderStock(items) {
  const el = document.getElementById('content');
  el.innerHTML = `
    <input class="search-box" id="stockSearch" placeholder="Поиск по названию или артикулу…">
    <div class="notice" style="margin-bottom:2px">Продажи за последние 30 дней · рекомендация — досыпать до запаса на 30 дней вперёд</div>
    <div class="product-list" id="stockList"></div>
  `;
  const searchEl = document.getElementById('stockSearch');

  const renderList = () => {
    const q = searchEl.value.trim().toLowerCase();
    let list = q ? items.filter(i => (i.name || '').toLowerCase().includes(q) || (i.offer_id || '').toLowerCase().includes(q)) : items.slice();
    // Товары, которым реально грозит аутсток — первыми; без продаж — в конец.
    list.sort((a, b) => {
      const aLeft = a.daysLeft === null ? Infinity : a.daysLeft;
      const bLeft = b.daysLeft === null ? Infinity : b.daysLeft;
      return aLeft - bLeft;
    });
    document.getElementById('stockList').innerHTML = list.slice(0, 300).map(stockCardHtml).join('')
      || '<div class="state-msg">Ничего не найдено</div>';
    bindStockHandlers(document.getElementById('stockList'), () => { stockItems = null; loadStock(); });
  };
  renderList();
  searchEl.addEventListener('input', renderList);
}

function stockCardHtml(p) {
  const urgent = p.daysLeft !== null && p.daysLeft < 14;
  const daysLeftText = p.daysLeft === null
    ? (p.totalStock > 0 ? 'нет продаж' : 'нет остатка')
    : `≈${Math.floor(p.daysLeft)} дн.`;
  return `<div class="price-card" data-offer="${p.offer_id}">
    <div class="p-name">${p.name}</div>
    <div class="p-offer copy-chip" data-copy="${p.offer_id}">${p.offer_id}</div>
    <div class="price-summary">
      <span>Остаток FBO: ${fmtNum(p.fbo_stock || 0)}</span>
      <span>FBS: ${fmtNum(p.fbs_stock || 0)}</span>
    </div>
    <div class="price-summary">
      <span>Продажи 30дн: ${fmtNum(p.qty30)} шт.</span>

    </div>

    <div class="cogs-row">

function bindStockHandlers(root, onSaved) {
  root.querySelectorAll('.price-card').forEach(card => {
    const saveBtn = card.querySelector('.fbs-stock-save');
    if (!saveBtn) return;
    saveBtn.addEventListener('click', async () => {
      const offerId = card.dataset.offer;
      const input = card.querySelector('.fbs-stock-input');
      const value = parseInt(input.value, 10);
      if (isNaN(value) || value < 0) { alert('Укажи остаток FBS — целое число от 0'); return; }
      saveBtn.disabled = true; saveBtn.textContent = 'Сохранение…';
      try {
        await apiFetch(`/api/cabinets/${activeCabinetId}/ozon/stocks`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ updates: [{ offer_id: offerId, stock: value }] }),
        });
        saveBtn.textContent = 'Сохранено ✓'; saveBtn.classList.add('saved');
        setTimeout(onSaved, 900);
      } catch (e) {
        saveBtn.textContent = 'Ошибка'; saveBtn.disabled = false;
        alert('Не удалось сохранить остаток: ' + e.message);
      }
    });
  });
}

        method: 'POST',
        headers: { 'Content-Type': 'application/json' },

    </div>
    <div class="price-profit-row">
      <span class="pp-label">Прибыль по акции</span>
      <span class="pp-value ${profitKnown ? (neg ? 'neg' : 'pos') : ''}">${profitKnown ? fmtMoney(p.profit) : 'нет данных'}</span>
    </div>
    ${profitKnown ? rateSourceBadge(p.rate_source) : ''}
    ${missingCogs ? `<div class="cogs-row">

  </div>`;
}

function candidateCardHtml(p) {
  const suggested = p.max_action_price || p.price || 0;
  // p.offer_id is only ever '' when the backend couldn't match this candidate
  // to our own price/commission data — computing a "profit" in that case would
  // silently use commission=0/logistics=0/cogs=0, i.e. show price itself as
  // profit. Same concern for cogs specifically: no cost price on file means
  // cogs_unit defaults to 0, which would silently show price-as-profit even
  // though the item isn't free. Both cases: treat profit as unknown and
  // don't offer to add it blind.
  const hasInfo = !!p.offer_id;
  const hasCogs = !!p.has_cost_price;
  const canEvaluate = hasInfo && hasCogs;
  return `<div class="price-card product-card" data-item="${p.offer_id}" data-pid="${p.product_id}" data-has-info="${canEvaluate ? '1' : '0'}"
      data-cogs="${p.cogs_unit}" data-commission="${p.commission_pct}" data-logistics="${p.logistics_estimate}" data-tax="${p.tax_pct || 0}">
    <div class="p-name">${p.name}</div>
    <div class="p-offer copy-chip" data-copy="${p.offer_id || p.product_id}">${p.offer_id || p.product_id}</div>
    ${hasInfo && !hasCogs ? `<div class="cogs-row">
      <label>Закупка/шт.</label>
      <input type="number" class="cogs-input" value="" placeholder="0">
      <button class="cogs-save">Сохранить</button>
    </div>` : ''}
    <div class="price-fields">
      <div class="price-field">
        <label>Цена по акции (макс. ${fmtMoney(p.max_action_price || 0)})</label>
        <input type="number" class="cand-price-input" value="${suggested}" ${canEvaluate ? '' : 'disabled'}>
      </div>
    </div>
    <div class="price-profit-row">
      <span class="pp-label">Прибыль по этой цене</span>
      <span class="pp-value cand-profit-out">${canEvaluate ? '—' : 'нет данных'}</span>
    </div>
    ${canEvaluate ? rateSourceBadge(p.rate_source) : ''}
    ${canEvaluate
      ? `<div class="price-save-row"><button class="price-save-btn action-add-btn" data-pid="${p.product_id}">Добавить в акцию</button></div>`
      : `<div class="price-suggest">${hasInfo ? 'Не указана себестоимость — заполни её выше, чтобы увидеть реальную прибыль.' : 'Нет данных о цене/комиссии для этого товара.'} Добавление отключено, пока прибыль не оценить.</div>`}
  </div>`;
}

function recalcCandProfit(card) {
  if (card.dataset.hasInfo === '0') return; // "нет данных" already rendered, nothing to compute
  const priceInput = card.querySelector('.cand-price-input');
  const out = card.querySelector('.cand-profit-out');
  if (!priceInput || !out) return;
  const price = parseFloat(priceInput.value) || 0;
  const cogs = parseFloat(card.dataset.cogs) || 0;
  const commission = parseFloat(card.dataset.commission) || 0;
  const logistics = parseFloat(card.dataset.logistics) || 0;
  const tax = parseFloat(card.dataset.tax) || 0;
  const profit = price - cogs - (price * (commission / 100) + logistics) - price * (tax / 100);
  out.textContent = fmtMoney(profit);
  out.classList.toggle('neg', profit < 0);
  out.classList.toggle('pos', profit >= 0);
}

async function onAddClick(e) {
  const btn = e.target;
  const card = btn.closest('.price-card');
  const pid = parseInt(card.dataset.pid, 10);
  const price = parseFloat(card.querySelector('.cand-price-input').value) || 0;
  if (price <= 0) { alert('Укажи цену по акции'); return; }
  btn.disabled = true; btn.textContent = 'Добавляю…';
  try {
    const resp = await apiFetch(`/api/cabinets/${activeCabinetId}/ozon/actions/${activeActionId}/add`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ items: [{ product_id: pid, action_price: price, stock: 0 }] }),
    });
    if (resp.rejected && resp.rejected.length) {
      alert('Ozon отклонил добавление: ' + JSON.stringify(resp.rejected));
      btn.disabled = false; btn.textContent = 'Добавить в акцию';
    } else {
      btn.textContent = 'Добавлено ✓';
      btn.classList.add('staged-btn');
    }
  } catch (err) {
    alert('Не удалось добавить: ' + err.message);
    btn.disabled = false; btn.textContent = 'Добавить в акцию';
  }
}

async function onRemoveClick(e) {
  const btn = e.target;
  const card = btn.closest('.price-card');
  const pid = parseInt(btn.dataset.pid, 10);
  btn.disabled = true; btn.textContent = 'Убираю…';
  try {
    await apiFetch(`/api/cabinets/${activeCabinetId}/ozon/actions/${activeActionId}/remove`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ product_ids: [pid] }),
    });
    card.remove();
  } catch (err) {
    alert('Не удалось убрать: ' + err.message);
    btn.disabled = false; btn.textContent = 'Убрать из акции';
  }
}

// ==================== Реклама ====================

let adsDays = 30;

async function loadAds() {
  const el = document.getElementById('content');
  const cabinet = activeCabinet();
  if (!cabinet || cabinet.marketplace !== 'wb') {
    el.innerHTML = '<div class="state-msg">Реклама Ozon пока недоступна — нужны отдельные ключи Ozon Performance API. Для Wildberries уже работает.</div>';
    return;
  }
  const reqView = activeView, reqCabinet = activeCabinetId;
  el.innerHTML = '<div class="state-msg">Загрузка рекламных кампаний…</div>';
  try {
    const data = await apiFetch(`/api/cabinets/${activeCabinetId}/ads?days=${adsDays}`);
    if (activeView !== reqView || activeCabinetId !== reqCabinet) return;
    renderAds(data);
  } catch (e) {
    if (activeView !== reqView || activeCabinetId !== reqCabinet) return;
    el.innerHTML = `<div class="state-msg">Не удалось загрузить рекламу.<br>${e.message}</div>`;
  }
}

function renderAds(data) {
  const el = document.getElementById('content');
  const t = data.totals;
  const drrClass = (drr) => drr === null ? '' : (drr > 20 ? 'neg' : 'pos');
  el.innerHTML = `
    <div class="card">
      <h3>Период</h3>
      <div class="quick-chips">
        <button data-days="7" class="${adsDays === 7 ? 'active-chip' : ''}">7 дн.</button>
        <button data-days="14" class="${adsDays === 14 ? 'active-chip' : ''}">14 дн.</button>
        <button data-days="30" class="${adsDays === 30 ? 'active-chip' : ''}">30 дн.</button>
        <button data-days="90" class="${adsDays === 90 ? 'active-chip' : ''}">90 дн.</button>
      </div>
    </div>
    <div class="notice" style="margin-bottom:2px">За период ${data.period_from} — ${data.period_to} · ${data.campaigns.length} кампани(й)</div>
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="k">Расход на рекламу</div>
        <div class="v">${fmtMoney(t.spend)}</div>
      </div>
      <div class="kpi-card">
        <div class="k">Выручка по рекламе</div>
        <div class="v">${fmtMoney(t.revenue)}</div>
      </div>
      <div class="kpi-card">
        <div class="k">ДРР</div>
        <div class="v ${drrClass(t.drr)}">${t.drr !== null ? t.drr.toFixed(1) + '%' : '—'}</div>
        <div class="kpi-sub">доля рекламных расходов в выручке</div>
      </div>
      <div class="kpi-card">
        <div class="k">Заказы по рекламе</div>
        <div class="v">${fmtNum(t.orders)}</div>
        <div class="kpi-sub">${fmtNum(t.clicks)} кликов · ${fmtNum(t.views)} показов</div>
      </div>
    </div>
    <input class="search-box" id="adsSearch" placeholder="Поиск по кампании…">
    <div class="product-list" id="adsList"></div>
  `;
  document.querySelectorAll('.quick-chips button').forEach(btn => {
    btn.addEventListener('click', () => {
      adsDays = parseInt(btn.dataset.days, 10);
      loadAds();
    });
  });
  const searchEl = document.getElementById('adsSearch');
  const renderList = () => {
    const q = searchEl.value.trim().toLowerCase();
    const list = q ? data.campaigns.filter(c => (c.name || '').toLowerCase().includes(q)) : data.campaigns;
    document.getElementById('adsList').innerHTML = list.map(adCardHtml).join('') || '<div class="state-msg">Нет активных кампаний за период</div>';
  };
  renderList();
  searchEl.addEventListener('input', renderList);
}

function adCardHtml(c) {
  const drrClass = c.drr === null ? '' : (c.drr > 20 ? 'neg' : 'pos');
  return `<div class="price-card">
    <div class="p-name">${c.name}</div>
    <div class="price-summary">
      <span>Расход: ${fmtMoney(c.spend)}</span>
      <span>Выручка: ${fmtMoney(c.revenue)}</span>
    </div>
    <div class="price-profit-row">
      <span class="pp-label">ДРР</span>
      <span class="pp-value ${drrClass}">${c.drr !== null ? c.drr.toFixed(1) + '%' : '—'}</span>
    </div>
    <div class="price-summary">
      <span>Заказы: ${fmtNum(c.orders)}</span>
      <span>CTR: ${c.ctr}% · CPC: ${fmtMoney(c.cpc)}</span>
    </div>
  </div>`;
}

// ==================== Настройки ====================

let cabinetSettingsData = null;

async function loadSettings() {
  const el = document.getElementById('content');
  const cabinet = activeCabinet();
  if (!cabinet || cabinet.marketplace !== 'ozon') {
    el.innerHTML = '<div class="state-msg">Настройки мониторинга пока доступны только для кабинетов Ozon.</div>';
    return;
  }
  const reqView = activeView, reqCabinet = activeCabinetId;
  el.innerHTML = '<div class="state-msg">Загрузка настроек…</div>';
  try {
    cabinetSettingsData = await apiFetch(`/api/cabinets/${activeCabinetId}/settings`);
    if (activeView !== reqView || activeCabinetId !== reqCabinet) return;
    renderSettings();
  } catch (e) {
    if (activeView !== reqView || activeCabinetId !== reqCabinet) return;
    el.innerHTML = `<div class="state-msg">Не удалось загрузить настройки.<br>${e.message}</div>`;
  }
}

async function saveSetting(patch, onFail) {
  try {
    cabinetSettingsData = await apiFetch(`/api/cabinets/${activeCabinetId}/settings`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(patch),
    });
    return true;
  } catch (e) {
    alert('Не удалось сохранить: ' + e.message);
    if (onFail) onFail();
    return false;
  }
}

function renderSettings() {
  const el = document.getElementById('content');
  const s = cabinetSettingsData || {};
  const autoRemove = s.promo_auto_remove !== false;
  const notifyDims = s.notify_dimension_changes !== false;
  const minMargin = s.min_margin_pct !== undefined ? s.min_margin_pct : 0;
  const taxPct = s.tax_pct !== undefined ? s.tax_pct : 0;

  el.innerHTML = `
    <div class="card">
      <h3>Минимальная маржа</h3>
      <div class="notice" style="margin-bottom:10px">Товары с маржой ниже этого значения считаются «невыгодными» — на них реагируют мониторинг цен и автовывод из акций.</div>
      <div class="price-fields">
        <div class="price-field">
          <label>Минимальная маржа, %</label>
          <input type="number" id="minMarginInput" value="${minMargin}" step="1">
        </div>
      </div>
      <div class="price-save-row"><button class="price-save-btn" id="minMarginSave">Сохранить</button></div>
    </div>

    <div class="card">
      <h3>Налог</h3>
      <div class="notice" style="margin-bottom:10px">Считается от цены продажи (не от суммы, которую перечисляет Ozon) и вычитается при расчёте прибыли — в «Ценах», «Детализации» и в акциях.</div>
      <div class="price-fields">
        <div class="price-field">
          <label>Налог, % от цены продажи</label>
          <input type="number" id="taxPctInput" value="${taxPct}" step="0.1">
        </div>
      </div>
      <div class="price-save-row"><button class="price-save-btn" id="taxPctSave">Сохранить</button></div>
    </div>

    <div class="card">
      <div class="toggle-row">
        <div>
          <div class="toggle-label">Автоматически убирать невыгодные товары из акций</div>
          <div class="toggle-sub">Проверяется каждые 10 минут. Если выключено — акции не трогаем, но пришлём уведомление, когда Ozon сам добавит туда товары.</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="autoRemoveToggle" ${autoRemove ? 'checked' : ''}>
          <span class="switch-slider"></span>
        </label>
      </div>
    </div>

    <div class="card">
      <div class="toggle-row">
        <div>
          <div class="toggle-label">Уведомлять об изменении габаритов и веса</div>
          <div class="toggle-sub">Ozon иногда сам меняет данные в карточке товара — это влияет на логистические тарифы.</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="notifyDimsToggle" ${notifyDims ? 'checked' : ''}>
          <span class="switch-slider"></span>
        </label>
      </div>
    </div>
  `;

  document.getElementById('minMarginSave').addEventListener('click', async () => {
    const btn = document.getElementById('minMarginSave');
    const value = parseFloat(document.getElementById('minMarginInput').value);
    if (isNaN(value)) { alert('Укажи число'); return; }
    btn.disabled = true; btn.textContent = 'Сохранение…';
    const ok = await saveSetting({ min_margin_pct: value });
    btn.disabled = false;
    btn.textContent = ok ? 'Сохранено ✓' : 'Сохранить';
    if (ok) setTimeout(() => { btn.textContent = 'Сохранить'; }, 1500);
  });

  document.getElementById('taxPctSave').addEventListener('click', async () => {
    const btn = document.getElementById('taxPctSave');
    const value = parseFloat(document.getElementById('taxPctInput').value);
    if (isNaN(value)) { alert('Укажи число'); return; }
    btn.disabled = true; btn.textContent = 'Сохранение…';
    const ok = await saveSetting({ tax_pct: value });
    btn.disabled = false;
    btn.textContent = ok ? 'Сохранено ✓' : 'Сохранить';
    if (ok) setTimeout(() => { btn.textContent = 'Сохранить'; }, 1500);
  });

  document.getElementById('autoRemoveToggle').addEventListener('change', async (e) => {
    const val = e.target.checked;
    const ok = await saveSetting({ promo_auto_remove: val });
    if (!ok) e.target.checked = !val;
  });

  document.getElementById('notifyDimsToggle').addEventListener('change', async (e) => {
    const val = e.target.checked;
    const ok = await saveSetting({ notify_dimension_changes: val });
    if (!ok) e.target.checked = !val;
  });
}

document.addEventListener('click', async (e) => {
  const chip = e.target.closest('.copy-chip');
  if (!chip) return;
  const value = chip.dataset.copy;
  if (!value) return;
  try {
    await navigator.clipboard.writeText(value);
  } catch (err) {
    const ta = document.createElement('textarea');
    ta.value = value; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e2) {}
    document.body.removeChild(ta);
  }
  chip.classList.add('copied');
  setTimeout(() => chip.classList.remove('copied'), 1200);
});

boot();
</script>
</body>
</html>
