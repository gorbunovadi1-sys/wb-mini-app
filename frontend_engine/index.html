<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ИИ Движок</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1" integrity="sha384-jb8JQMbMoBUzgWatfe6COACi2ljcDdZQ2OxczGA3bGNeWe+6DChMTBJemed7ZnvJ" crossorigin="anonymous"></script>
<style>
:root {
  --bg: #07060f; --surface: #131024; --surface-2: #1b1733; --border: #2b2650;
  --text: #ffffff; --text-secondary: #9691b8;
  --accent: #8b5cf6; --accent-2: #4f7cff; --accent-3: #ec4899;
  --accent-gradient: linear-gradient(90deg, var(--accent-2), var(--accent), var(--accent-3));
  --accent-dim: rgba(139,92,246,0.16); --accent-text-on: #ffffff;
  --positive: #34d399; --negative: #f87171;
  --warn-bg: rgba(236,72,153,0.14); --warn-text: #f472b6;
  --scrim: rgba(3,2,10,0.7);
  --glow: 0 0 20px rgba(139,92,246,0.35);
  --font: "Inter", -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { font-family: var(--font); background: var(--bg); color: var(--text); font-size: 14px; }

.topbar {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; background: var(--bg); border-bottom: 1px solid var(--border);
}
.icon-btn {
  width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text); display: flex; align-items: center; justify-content: center;
  font-size: 16px; cursor: pointer; flex: none;
}
.topbar .title-block { flex: 1; min-width: 0; }
.topbar h1 { font-size: 16px; font-weight: 700; }
.topbar .sub { font-size: 10.5px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .06em; margin-top: 2px; }

main { padding: 16px; display: flex; flex-direction: column; gap: 14px; max-width: 720px; margin: 0 auto; padding-bottom: 90px; }

.cabinet-select-wrap { position: relative; }
.cabinet-select {
  width: 100%; appearance: none; background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 10px 34px 10px 14px; color: var(--text); font-family: var(--font); font-size: 13px; font-weight: 600; cursor: pointer;
}
.cabinet-select-wrap::after {
  content: '▾'; position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
  color: var(--text-secondary); pointer-events: none; font-size: 12px;
}

/* ---- Drawer nav ---- */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 29; opacity: 0; pointer-events: none; transition: opacity .2s ease; }
.scrim.open { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed; top: 0; left: 0; bottom: 0; width: 230px; z-index: 30;
  background: var(--surface); border-right: 1px solid var(--border);
  transform: translateX(-100%); transition: transform .25s ease;
  display: flex; flex-direction: column; padding: 18px 14px;
}
.drawer.open { transform: translateX(0); }
.drawer .brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 20px; }
.drawer .brand-mark {
  width: 32px; height: 32px; border-radius: 9px; background: var(--accent-gradient); box-shadow: var(--glow);
  display: flex; align-items: center; justify-content: center; font-size: 17px;
}
.drawer .brand-name { font-weight: 700; font-size: 13.5px; }
.drawer nav { display: flex; flex-direction: column; gap: 2px; }
.drawer nav button {
  display: flex; align-items: center; gap: 11px; text-align: left;
  padding: 10px 12px; border-radius: 10px; border: none; background: none;
  color: var(--text-secondary); font-family: var(--font); font-size: 13.5px; font-weight: 500; cursor: pointer;
}
.drawer nav button .ic { font-size: 15px; width: 18px; text-align: center; }
.drawer nav button.active { background: var(--accent-dim); color: var(--accent); font-weight: 600; }

.period-row { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .04em; }
.kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kpi-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 13px 14px; }
.kpi-card .k { font-size: 10.5px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
.kpi-card .v { font-family: var(--font-mono); font-size: 19px; font-weight: 700; margin-top: 6px; font-variant-numeric: tabular-nums; }
.kpi-card .kpi-sub { font-size: 10px; color: var(--text-secondary); margin-top: 5px; line-height: 1.3; }
.delta { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; margin-top: 6px; font-family: var(--font-mono); }
.delta.up { color: var(--positive); }
.delta.down { color: var(--negative); }
.delta.flat { color: var(--text-secondary); }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
.card h3 { font-size: 12.5px; font-weight: 600; margin-bottom: 12px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .04em; }
.card canvas { max-height: 200px; }

.date-range { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
.date-range .field { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 120px; }
.date-range label { font-size: 10px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .04em; }
.date-range input[type=date] {
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 8px; color: var(--text);
  font-family: var(--font); font-size: 12.5px;
}
.date-range button {
  flex: none; border: none; background: var(--accent-gradient); color: var(--accent-text-on); box-shadow: var(--glow);
  font-family: var(--font); font-size: 12.5px; font-weight: 700; padding: 9px 16px; border-radius: 8px; cursor: pointer;
}
.quick-chips { display: flex; gap: 6px; margin-top: 8px; }
.quick-chips button {
  flex: 1; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-secondary);
  font-family: var(--font); font-size: 11px; font-weight: 600; padding: 5px 0; border-radius: 7px; cursor: pointer;
}

.product-list { display: flex; flex-direction: column; gap: 10px; }
.product-card .product-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 6px; min-width: 0; }
.product-name { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.product-profit { font-family: var(--font-mono); font-size: 13px; font-weight: 700; flex: none; }
.product-profit.neg { color: var(--negative); }
.product-bar-track { height: 5px; background: var(--surface-2); border-radius: 3px; margin-bottom: 6px; overflow: hidden; }
.product-bar-fill { height: 100%; border-radius: 3px; background: var(--accent-gradient); }
.product-bar-fill.neg { background: var(--negative); }
.product-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-secondary); font-family: var(--font-mono); }

.notice { background: var(--warn-bg); border-radius: 10px; padding: 10px 12px; font-size: 12px; color: var(--warn-text); line-height: 1.4; }

.search-box {
  width: 100%; box-sizing: border-box; background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 10px 12px; font-family: var(--font); font-size: 13px; color: var(--text);
}

.cogs-row { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
.cogs-row label { font-size: 10.5px; color: var(--text-secondary); flex: none; }
.cogs-row input {
  flex: 1; min-width: 0; box-sizing: border-box; background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 7px; padding: 5px 8px; font-family: var(--font-mono); font-size: 12px; color: var(--text);
}
.cogs-row button {
  flex: none; border: none; background: var(--accent-gradient); color: var(--accent-text-on);
  font-family: var(--font); font-size: 11px; font-weight: 600; padding: 6px 10px; border-radius: 7px; cursor: pointer;
}
.cogs-row button:disabled { opacity: 0.5; }
.cogs-row button.saved { background: var(--positive); }
.state-msg { text-align: center; padding: 60px 20px; color: var(--text-secondary); font-size: 13px; line-height: 1.6; }
.state-msg b { color: var(--text); }

/* ---- Pricing tab ---- */
.price-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
.price-card.staged { border-color: var(--accent); }
.price-card .p-name { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
.price-card .p-offer { font-size: 10.5px; color: var(--text-secondary); font-family: var(--font-mono); margin-bottom: 10px; }
.price-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.price-field label { font-size: 10px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .03em; display: block; margin-bottom: 4px; }
.price-field input {
  width: 100%; box-sizing: border-box; background: var(--surface-2); border: 1px solid var(--border); border-radius: 7px;
  padding: 7px 8px; font-family: var(--font-mono); font-size: 13px; color: var(--text);
}
.price-summary { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--text-secondary); font-family: var(--font-mono); margin-bottom: 8px; }
.price-profit-row { display: flex; justify-content: space-between; align-items: baseline; padding-top: 8px; border-top: 1px solid var(--border); }
.price-profit-row .pp-label { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; }
.price-profit-row .pp-value { font-family: var(--font-mono); font-size: 17px; font-weight: 700; }
.price-profit-row .pp-value.neg { color: var(--negative); }
.price-profit-row .pp-value.pos { color: var(--positive); }
.price-suggest { font-size: 10.5px; color: var(--text-secondary); margin-top: 4px; }
.price-suggest b { color: var(--positive); font-family: var(--font-mono); }
.price-save-row { margin-top: 10px; display: flex; justify-content: flex-end; }
.price-save-btn {
  border: none; border-radius: 8px; padding: 7px 14px; font-family: var(--font); font-size: 11.5px; font-weight: 700; cursor: pointer;
}
.price-save-btn.pos { background: var(--accent-gradient); color: var(--accent-text-on); box-shadow: var(--glow); }
.price-save-btn.staged-btn { background: var(--positive); color: #06281c; }
.push-bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 12px 16px;
  background: var(--surface); border-top: 1px solid var(--accent); display: none; align-items: center; justify-content: space-between;
}
.push-bar.show { display: flex; }
.push-bar span { font-size: 12.5px; font-weight: 600; }
.push-bar button {
  border: none; background: var(--accent-gradient); color: var(--accent-text-on); font-family: var(--font); font-weight: 700;
  font-size: 12.5px; padding: 9px 16px; border-radius: 8px; cursor: pointer; box-shadow: var(--glow);
}
.push-bar button:disabled { opacity: 0.5; }
</style>
</head>
<body>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer">
  <div class="brand">
    <div class="brand-mark">🧠</div>
    <div class="brand-name">ИИ Движок</div>
  </div>
  <nav id="viewNav">
    <button data-view="dashboard" class="active"><span class="ic">◆</span>Дашборд</button>
    <button data-view="detail"><span class="ic">▤</span>Детализация</button>
    <button data-view="pricing"><span class="ic">₽</span>Цены</button>
  </nav>
</aside>

<header class="topbar">
  <button class="icon-btn" id="menuBtn">☰</button>
  <div class="title-block">
    <h1 id="viewTitle">Дашборд</h1>
    <div class="sub" id="topbarSub">выбери кабинет</div>
  </div>
</header>

<main>
  <div class="cabinet-select-wrap">
    <select class="cabinet-select" id="cabinetSelect"></select>
  </div>
  <div id="content"><div class="state-msg">Загрузка…</div></div>
</main>

<div class="push-bar" id="pushBar">
  <span id="pushBarText">Изменено: 0</span>
  <button id="pushBarBtn">Отправить обновления</button>
</div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
function initData() { return tg ? tg.initData : ''; }

function devTelegramId() {
  return new URLSearchParams(location.search).get('telegram_id');
}
function withAuthQS(path) {
  const id = devTelegramId();
  if (!id) return path;
  return path + (path.includes('?') ? '&' : '?') + `telegram_id=${id}`;
}
async function apiFetch(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign({ 'X-Telegram-Init-Data': initData() }, opts.headers || {});
  const res = await fetch(withAuthQS(path), opts);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

function fmtMoney(v) {
  const sign = v < 0 ? '−' : '';
  return sign + Math.round(Math.abs(v)).toLocaleString('ru-RU') + ' ₽';
}
function fmtNum(v) { return Math.round(v).toLocaleString('ru-RU'); }
function isoDate(d) { return d.toISOString().slice(0, 10); }

function deltaHtml(cmp) {
  if (!cmp || cmp.pct === null || cmp.pct === undefined) return '';
  const dir = cmp.pct > 0.05 ? 'up' : cmp.pct < -0.05 ? 'down' : 'flat';
  const arrow = dir === 'up' ? '▲' : dir === 'down' ? '▼' : '·';
  const sign = cmp.pct > 0 ? '+' : '';
  return `<div class="delta ${dir}">${arrow} ${sign}${cmp.pct.toFixed(1)}%</div>`;
}

let cabinetsList = [];
let activeCabinetId = null;
let activeView = 'dashboard';
let periodFrom = isoDate(new Date(Date.now() - 29 * 86400000));
let periodTo = isoDate(new Date());
let lastMarginData = null;
let pricingItems = null;
let pendingPriceChanges = {}; // offer_id -> price

const VIEW_TITLES = { dashboard: 'Дашборд', detail: 'Детализация', pricing: 'Цены' };

async function boot() {
  try {
    const data = await apiFetch('/api/me/cabinets');
    cabinetsList = data.cabinets;
  } catch (e) {
    document.getElementById('content').innerHTML = `<div class="state-msg">Не удалось загрузить кабинеты.<br>${e.message}</div>`;
    return;
  }

  const drawer = document.getElementById('drawer');
  const scrim = document.getElementById('scrim');
  document.getElementById('menuBtn').addEventListener('click', () => {
    drawer.classList.add('open'); scrim.classList.add('open');
  });
  scrim.addEventListener('click', () => {
    drawer.classList.remove('open'); scrim.classList.remove('open');
  });
  document.querySelectorAll('#viewNav button').forEach(btn => {
    btn.addEventListener('click', () => {
      activeView = btn.dataset.view;
      document.querySelectorAll('#viewNav button').forEach(b => b.classList.toggle('active', b === btn));
      document.getElementById('viewTitle').textContent = VIEW_TITLES[activeView];
      drawer.classList.remove('open'); scrim.classList.remove('open');
      loadView();
    });
  });
  document.getElementById('pushBarBtn').addEventListener('click', pushPriceUpdates);

  if (cabinetsList.length) {
    activeCabinetId = cabinetsList[0].id;
    renderCabinetSelect();
    loadView();
  } else {
    document.getElementById('content').innerHTML = `<div class="state-msg"><b>Кабинеты пока не подключены.</b><br>Вернись в чат с ботом и нажми «Подключить Wildberries» или «Подключить Ozon».</div>`;
  }
}

function renderCabinetSelect() {
  const el = document.getElementById('cabinetSelect');
  const marketLabel = { wb: 'WB', ozon: 'Ozon' };
  el.innerHTML = cabinetsList.map(c => `
    <option value="${c.id}" ${c.id === activeCabinetId ? 'selected' : ''}>${c.display_name || marketLabel[c.marketplace] || c.marketplace}</option>
  `).join('');
  el.addEventListener('change', () => {
    activeCabinetId = parseInt(el.value, 10);
    lastMarginData = null; pricingItems = null; pendingPriceChanges = {};
    updatePushBar();
    loadView();
  });
}

function activeCabinet() { return cabinetsList.find(c => c.id === activeCabinetId); }

function loadView() {
  const cabinet = activeCabinet();
  document.getElementById('topbarSub').textContent = cabinet ? (cabinet.display_name || cabinet.marketplace) : '';
  if (activeView === 'dashboard') return loadDashboard();
  if (activeView === 'detail') return loadDetail();
  if (activeView === 'pricing') return loadPricing();
}

// ==================== Dashboard ====================

async function loadDashboard(fromDate, toDate) {
  if (fromDate) periodFrom = fromDate;
  if (toDate) periodTo = toDate;
  const el = document.getElementById('content');
  el.innerHTML = '<div class="state-msg">Загрузка данных… (может занять до минуты)</div>';
  try {
    const data = await apiFetch(`/api/cabinets/${activeCabinetId}/margin?date_from=${periodFrom}&date_to=${periodTo}`);
    lastMarginData = data;
    renderDashboard(data, activeCabinet());
  } catch (e) {
    el.innerHTML = `<div class="state-msg">Не удалось загрузить данные кабинета.<br>${e.message}</div>`;
  }
}

function renderDashboard(data, cabinet) {
  const el = document.getElementById('content');
  const acc = data.account;
  const cmp = data.compare || {};
  const genDate = new Date(data.generated_at);
  const updatedStr = genDate.toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  const isOzon = cabinet && cabinet.marketplace === 'ozon';

  const hasOrdersData = acc.orders_qty !== undefined;
  const ordersBlock = hasOrdersData ? `
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="k">Заказы</div>
        <div class="v">${fmtMoney(acc.orders_revenue)}</div>
        <div class="kpi-sub">${fmtNum(acc.orders_qty)} шт.</div>
      </div>
      <div class="kpi-card">
        <div class="k">Выкуплено</div>
        <div class="v">${fmtMoney(acc.buyouts_revenue)}</div>
        <div class="kpi-sub">${fmtNum(acc.buyouts_qty)} шт.${acc.buyout_rate !== null ? ` · ${acc.buyout_rate}% выкупа` : ''}</div>
      </div>
    </div>
  ` : '';

  const kpis = isOzon ? [
    { label: 'Себестоимость', value: fmtMoney(acc.cogs_total || 0), sub: 'закупка выкупленных товаров' },
    { label: 'Комиссия', value: fmtMoney(acc.commission || 0), sub: 'комиссия Ozon с продаж' },
    { label: 'Прочие сборы', value: fmtMoney(acc.other_fees || 0), sub: 'эквайринг, упаковка, хранение...' },
    { label: 'Прибыль', value: fmtMoney(acc.profit), cmp: cmp.profit, sub: 'выкуплено минус все расходы и себестоимость' },
    { label: 'Маржа', value: acc.margin_percent.toFixed(1) + '%', cmp: cmp.margin_percent, sub: 'прибыль ÷ выкуплено' },
  ] : [
    { label: 'Выручка', value: fmtMoney(acc.revenue), cmp: cmp.revenue },
    { label: 'Прибыль', value: fmtMoney(acc.profit), cmp: cmp.profit },
    { label: 'Реклама', value: fmtMoney(acc.ad_spend || 0) },
    { label: 'Маржа', value: acc.margin_percent.toFixed(1) + '%', cmp: cmp.margin_percent },
  ];

  const daily = data.daily || [];
  const sortedProducts = [...(data.products || [])].sort((a, b) => b.profit - a.profit).slice(0, 8);
  const maxAbsProfit = Math.max(...sortedProducts.map(p => Math.abs(p.profit)), 1);
  const productsHtml = sortedProducts.map(p => productCardHtml(p, maxAbsProfit)).join('')
    || '<div class="state-msg">Нет данных за период</div>';

  const costKnown = acc.cost_prices_known_for || 0, costTotal = acc.cost_prices_total_products || 0;

  el.innerHTML = `
    <div class="card">
      <h3>Период</h3>
      <div class="date-range">
        <div class="field"><label>С</label><input type="date" id="dateFrom" value="${periodFrom}"></div>
        <div class="field"><label>По</label><input type="date" id="dateTo" value="${periodTo}"></div>
        <button id="applyPeriod">Показать</button>
      </div>
      <div class="quick-chips">
        <button data-days="7">7 дн.</button>
        <button data-days="14">14 дн.</button>
        <button data-days="30">30 дн.</button>
        <button data-days="90">90 дн.</button>
      </div>
    </div>

    ${ordersBlock}
    <div class="notice" style="margin-bottom:2px">За период ${data.period_from} — ${data.period_to} (${data.period_days} дн.) · обновлено ${updatedStr}${costTotal ? ` · себестоимость указана для ${costKnown}/${costTotal} товаров` : ''}</div>

    <div class="kpi-grid">
      ${kpis.map(k => `
        <div class="kpi-card">
          <div class="k">${k.label}</div>
          <div class="v">${k.value}</div>
          ${deltaHtml(k.cmp)}
          ${k.sub ? `<div class="kpi-sub">${k.sub}</div>` : ''}
        </div>`).join('')}
    </div>

    <div class="card">
      <h3>Заказы по дням</h3>
      ${daily.length ? `<canvas id="revenueChart"></canvas>` : '<div class="state-msg">Нет данных за период</div>'}
    </div>

    <div class="card">
      <h3>Топ товаров по прибыли</h3>
      <div class="product-list">${productsHtml}</div>
    </div>
  `;

  document.getElementById('applyPeriod').addEventListener('click', () => {
    const f = document.getElementById('dateFrom').value;
    const t = document.getElementById('dateTo').value;
    if (!f || !t) { alert('Укажи обе даты'); return; }
    if (f > t) { alert('Дата "с" не может быть позже даты "по"'); return; }
    loadDashboard(f, t);
  });
  document.querySelectorAll('.quick-chips button').forEach(btn => {
    btn.addEventListener('click', () => {
      const days = parseInt(btn.dataset.days, 10);
      const to = new Date();
      const from = new Date(Date.now() - (days - 1) * 86400000);
      loadDashboard(isoDate(from), isoDate(to));
    });
  });

  bindCogsHandlers(el, () => loadDashboard());

  if (daily.length) {
    const canvas = document.getElementById('revenueChart');
    const ctx = canvas.getContext('2d');
    const lineGradient = ctx.createLinearGradient(0, 0, canvas.clientWidth || 300, 0);
    lineGradient.addColorStop(0, '#4f7cff');
    lineGradient.addColorStop(0.55, '#8b5cf6');
    lineGradient.addColorStop(1, '#ec4899');
    const fillGradient = ctx.createLinearGradient(0, 0, 0, canvas.clientHeight || 200);
    fillGradient.addColorStop(0, 'rgba(139,92,246,0.32)');
    fillGradient.addColorStop(1, 'rgba(139,92,246,0.02)');

    new Chart(canvas, {
      type: 'line',
      data: {
        labels: daily.map(d => d.date.slice(5)),
        datasets: [{
          data: daily.map(d => d.revenue),
          borderColor: lineGradient, backgroundColor: fillGradient,
          fill: true, tension: 0.35, pointRadius: 0, borderWidth: 2.5,
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => fmtMoney(c.parsed.y) } } },
        scales: {
          x: { grid: { display: false }, ticks: { color: '#9691b8', maxTicksLimit: 6, font: { size: 10 } } },
          y: { grid: { color: '#2b2650' }, ticks: { color: '#9691b8', font: { size: 10 }, callback: v => (v/1000) + 'k' } }
        }
      }
    });
  }
}

function productCardHtml(p, maxAbsProfit) {
  const neg = p.profit < 0;
  const barWidth = Math.max(4, Math.abs(p.profit) / maxAbsProfit * 100);
  const itemKey = p.offer_id !== undefined && p.offer_id !== null ? p.offer_id : p.nm_id;
  return `<div class="product-card" data-item="${itemKey}">
    <div class="product-top">
      <div class="product-name">${p.title}</div>
      <div class="product-profit ${neg ? 'neg' : ''}">${fmtMoney(p.profit)}</div>
    </div>
    <div class="product-bar-track"><div class="product-bar-fill ${neg ? 'neg' : ''}" style="width:${barWidth}%"></div></div>
    <div class="product-meta"><span>выручка ${fmtMoney(p.revenue)} · ${p.qty} шт.</span><span>маржа ${p.margin_percent.toFixed(1)}%</span></div>
    <div class="cogs-row">
      <label>Закупка/шт.</label>
      <input type="number" class="cogs-input" value="${p.cogs_unit || ''}" placeholder="0">
      <button class="cogs-save">Сохранить</button>
    </div>
  </div>`;
}

function bindCogsHandlers(root, onSaved) {
  root.querySelectorAll('.product-card').forEach(card => {
    card.querySelector('.cogs-save').addEventListener('click', async () => {
      const btn = card.querySelector('.cogs-save');
      const input = card.querySelector('.cogs-input');
      const itemKey = card.dataset.item;
      const value = parseFloat(input.value);
      if (!value || value < 0) { alert('Укажи закупочную цену за штуку'); return; }
      btn.disabled = true; btn.textContent = 'Сохранение…';
      try {
        await apiFetch(`/api/cabinets/${activeCabinetId}/cost-prices`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prices: { [itemKey]: value } }),
        });
        btn.textContent = 'Сохранено ✓'; btn.classList.add('saved');
        setTimeout(onSaved, 900);
      } catch (e) {
        btn.textContent = 'Ошибка'; btn.disabled = false;
        alert('Не удалось сохранить: ' + e.message);
      }
    });
  });
}

// ==================== Детализация по товарам ====================

async function loadDetail() {
  const el = document.getElementById('content');
  el.innerHTML = '<div class="state-msg">Загрузка…</div>';
  if (!lastMarginData) {
    try {
      lastMarginData = await apiFetch(`/api/cabinets/${activeCabinetId}/margin?date_from=${periodFrom}&date_to=${periodTo}`);
    } catch (e) {
      el.innerHTML = `<div class="state-msg">Не удалось загрузить данные.<br>${e.message}</div>`;
      return;
    }
  }
  renderDetail(lastMarginData.products || []);
}

function renderDetail(products) {
  const el = document.getElementById('content');
  el.innerHTML = `
    <input class="search-box" id="detailSearch" placeholder="Поиск по названию или артикулу…">
    <div class="notice">За период ${lastMarginData.period_from} — ${lastMarginData.period_to} · ${products.length} товаров с продажами</div>
    <div class="product-list" id="detailList"></div>
  `;
  const renderList = (items) => {
    const listEl = document.getElementById('detailList');
    const sorted = [...items].sort((a, b) => b.revenue - a.revenue);
    const maxAbsProfit = Math.max(...sorted.map(p => Math.abs(p.profit)), 1);
    listEl.innerHTML = sorted.map(p => productCardHtml(p, maxAbsProfit)).join('') || '<div class="state-msg">Ничего не найдено</div>';
    bindCogsHandlers(listEl, loadDetail);
  };
  renderList(products);
  document.getElementById('detailSearch').addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    const filtered = q ? products.filter(p =>
      (p.title || '').toLowerCase().includes(q) || String(p.offer_id || p.nm_id || '').toLowerCase().includes(q)
    ) : products;
    renderList(filtered);
  });
}

// ==================== Цены ====================

async function loadPricing() {
  const el = document.getElementById('content');
  const cabinet = activeCabinet();
  if (!cabinet || cabinet.marketplace !== 'ozon') {
    el.innerHTML = '<div class="state-msg">Управление ценами пока доступно только для кабинетов Ozon.</div>';
    return;
  }
  el.innerHTML = '<div class="state-msg">Загрузка товаров…</div>';
  try {
    if (!pricingItems) {
      const data = await apiFetch(`/api/cabinets/${activeCabinetId}/ozon/pricing`);
      pricingItems = data.items;
      pricingItems.forEach(p => {
        const price = p.min_price || p.price || 0;
        p.currentProfit = computePriceRow(price, p.cogs_unit || 0, p.commission_pct, p.logistics_estimate).profit;
      });
    }
    renderPricing(pricingItems);
  } catch (e) {
    el.innerHTML = `<div class="state-msg">Не удалось загрузить цены.<br>${e.message}</div>`;
  }
}

function computePriceRow(price, cogs, commissionPct, logisticsEstimate) {
  const expensePerUnit = price * (commissionPct / 100) + logisticsEstimate;
  const profit = price - cogs - expensePerUnit;
  return { expensePerUnit, profit };
}

function suggestPrice(cogs, commissionPct, logisticsEstimate, targetMarginPct) {
  // price - cogs - price*commissionPct/100 - logistics = price*targetMarginPct/100
  const denom = 1 - commissionPct / 100 - targetMarginPct / 100;
  if (denom <= 0) return null;
  return (cogs + logisticsEstimate) / denom;
}

function renderPricing(items) {
  const el = document.getElementById('content');
  el.innerHTML = `
    <input class="search-box" id="pricingSearch" placeholder="Поиск по названию или артикулу…">
    <div class="date-range" style="align-items:center">
      <div class="field" style="flex:2">
        <label>Сортировка по прибыли</label>
        <select id="pricingSort" class="cabinet-select" style="padding:8px 10px">
          <option value="none">Без сортировки</option>
          <option value="asc">Сначала убыточные</option>
          <option value="desc">Сначала прибыльные</option>
        </select>
      </div>
      <div class="field" style="flex:1;flex-direction:row;align-items:center;gap:6px;padding-bottom:2px">
        <input type="checkbox" id="pricingOnlyNeg" style="width:16px;height:16px">
        <label style="margin:0" for="pricingOnlyNeg">Только убыточные</label>
      </div>
    </div>
    <div class="product-list" id="pricingList"></div>
  `;
  const searchEl = document.getElementById('pricingSearch');
  const sortEl = document.getElementById('pricingSort');
  const onlyNegEl = document.getElementById('pricingOnlyNeg');

  const renderList = () => {
    const q = searchEl.value.trim().toLowerCase();
    let list = q ? items.filter(i => (i.name||'').toLowerCase().includes(q) || (i.offer_id||'').toLowerCase().includes(q)) : items.slice();
    if (onlyNegEl.checked) list = list.filter(i => i.currentProfit < 0);
    if (sortEl.value === 'asc') list = [...list].sort((a, b) => a.currentProfit - b.currentProfit);
    else if (sortEl.value === 'desc') list = [...list].sort((a, b) => b.currentProfit - a.currentProfit);

    const listEl = document.getElementById('pricingList');
    listEl.innerHTML = list.slice(0, 200).map(priceCardHtml).join('') || '<div class="state-msg">Ничего не найдено</div>';
    listEl.querySelectorAll('.price-card').forEach(bindPriceCard);
  };
  renderList();
  searchEl.addEventListener('input', renderList);
  sortEl.addEventListener('change', renderList);
  onlyNegEl.addEventListener('change', renderList);
}

function priceCardHtml(p) {
  const staged = pendingPriceChanges[p.offer_id] !== undefined;
  return `<div class="price-card ${staged ? 'staged' : ''}" data-offer="${p.offer_id}"
      data-commission="${p.commission_pct}" data-logistics="${p.logistics_estimate}" data-old-price="${p.old_price || 0}">
    <div class="p-name">${p.name}</div>
    <div class="p-offer">${p.offer_id}</div>
    <div class="price-fields">
      <div class="price-field">
        <label>Цена (без акций)</label>
        <input type="number" class="price-input" value="${staged ? pendingPriceChanges[p.offer_id].price : (p.min_price || p.price || '')}">
      </div>
      <div class="price-field">
        <label>Себестоимость</label>
        <input type="number" class="cogs-price-input" value="${p.cogs_unit || ''}" placeholder="0">
      </div>
    </div>
    <div class="price-summary">
      <span>Комиссия ${p.commission_pct}%</span>
      <span class="expense-out">расход/шт. —</span>
    </div>
    <div class="price-profit-row">
      <span class="pp-label">Прибыль со штуки</span>
      <span class="pp-value profit-out">—</span>
    </div>
    <div class="price-suggest suggest-out"></div>
    <div class="price-save-row"><button class="price-save-btn">Сохранить</button></div>
  </div>`;
}

function bindPriceCard(card) {
  const offerId = card.dataset.offer;
  const commissionPct = parseFloat(card.dataset.commission) || 0;
  const logisticsEstimate = parseFloat(card.dataset.logistics) || 0;
  const oldPriceOriginal = parseFloat(card.dataset.oldPrice) || 0;
  const priceInput = card.querySelector('.price-input');
  const cogsInput = card.querySelector('.cogs-price-input');
  const expenseOut = card.querySelector('.expense-out');
  const profitOut = card.querySelector('.profit-out');
  const suggestOut = card.querySelector('.suggest-out');
  const saveBtn = card.querySelector('.price-save-btn');

  function recalc() {
    const price = parseFloat(priceInput.value) || 0;
    const cogs = parseFloat(cogsInput.value) || 0;
    const { expensePerUnit, profit } = computePriceRow(price, cogs, commissionPct, logisticsEstimate);
    expenseOut.textContent = `расход/шт. ${fmtMoney(expensePerUnit)}`;
    profitOut.textContent = fmtMoney(profit);
    profitOut.classList.toggle('neg', profit < 0);
    profitOut.classList.toggle('pos', profit >= 0);

    if (profit < 0) {
      const suggested = suggestPrice(cogs, commissionPct, logisticsEstimate, 15);
      if (suggested && suggested > price) {
        const { profit: newProfit } = computePriceRow(suggested, cogs, commissionPct, logisticsEstimate);
        suggestOut.innerHTML = `Чтобы выйти в плюс: цена от <b>${fmtMoney(suggested)}</b> (прибыль ${fmtMoney(newProfit)})`;
      } else {
        suggestOut.textContent = '';
      }
      saveBtn.className = 'price-save-btn';
      saveBtn.style.opacity = '0.4';
      saveBtn.disabled = true;
      saveBtn.textContent = 'Прибыль отрицательная';
    } else {
      suggestOut.textContent = '';
      saveBtn.disabled = false;
      saveBtn.style.opacity = '1';
      const isStaged = pendingPriceChanges[offerId] !== undefined;
      saveBtn.className = 'price-save-btn ' + (isStaged ? 'staged-btn' : 'pos');
      saveBtn.textContent = isStaged ? 'В очереди на отправку ✓' : 'Сохранить';
    }
  }

  priceInput.addEventListener('input', recalc);
  cogsInput.addEventListener('input', recalc);

  saveBtn.addEventListener('click', async () => {
    const price = parseFloat(priceInput.value) || 0;
    const cogs = parseFloat(cogsInput.value) || 0;
    if (price <= 0) { alert('Укажи цену'); return; }
    saveBtn.disabled = true; saveBtn.textContent = 'Сохранение…';
    try {
      if (cogs > 0) {
        await apiFetch(`/api/cabinets/${activeCabinetId}/cost-prices`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prices: { [offerId]: cogs } }),
        });
      }
      // Ozon requires price <= old_price (old_price is the pre-discount
      // reference shown crossed out) — if the new price exceeds it, bump
      // old_price to match so there's simply no discount shown, instead of
      // Ozon silently rejecting the whole update ("Old price is less than price").
      const oldPriceToSend = Math.max(oldPriceOriginal, price);
      pendingPriceChanges[offerId] = { price, old_price: oldPriceToSend };
      card.classList.add('staged');
      updatePushBar();
      recalc();
    } catch (e) {
      alert('Не удалось сохранить себестоимость: ' + e.message);
      saveBtn.disabled = false;
    }
  });

  recalc();
}

function updatePushBar() {
  const bar = document.getElementById('pushBar');
  const count = Object.keys(pendingPriceChanges).length;
  document.getElementById('pushBarText').textContent = `Изменено цен: ${count}`;
  bar.classList.toggle('show', count > 0);
}

async function pushPriceUpdates() {
  const btn = document.getElementById('pushBarBtn');
  const updates = Object.entries(pendingPriceChanges).map(([offer_id, v]) => ({ offer_id, price: v.price, old_price: v.old_price }));
  if (!updates.length) return;
  btn.disabled = true; btn.textContent = 'Отправляю…';
  try {
    const resp = await apiFetch(`/api/cabinets/${activeCabinetId}/ozon/prices`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ updates }),
    });
    const results = resp.results || [];
    const failed = results.filter(r => r.updated === false);
    pendingPriceChanges = {};
    pricingItems = null;
    updatePushBar();
    btn.textContent = 'Отправить обновления';
    btn.disabled = false;
    if (failed.length) {
      const lines = failed.map(f => `${f.offer_id}: ${(f.errors || []).map(e => e.message || JSON.stringify(e)).join('; ') || 'отклонено Ozon без причины'}`);
      alert(`Ozon отклонил ${failed.length} из ${results.length} обновлений:\n\n${lines.join('\n')}`);
    } else if (!results.length) {
      alert('Ozon не прислал подтверждение по товарам — проверь цены вручную, возможно обновление не применилось.');
    } else {
      alert(`Ozon подтвердил обновление ${results.length} товар(ов).`);
    }
    loadPricing();
  } catch (e) {
    alert('Не удалось отправить обновления в Ozon: ' + e.message);
    btn.textContent = 'Отправить обновления';
    btn.disabled = false;
  }
}

boot();
</script>
